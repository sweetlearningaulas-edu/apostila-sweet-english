<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Home Sweet English</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:Verdana,Geneva,Tahoma,sans-serif;}
body.dark{
  --bg-shell:#0a0a0a;--bg:#111114;--card:#191920;--card2:#1f1f28;
  --line:#272730;--blue:#6eb5ff;--purple:#c4a0ff;
  --red:#ff8080;--yel:#ffd580;--green:#7de8a0;
  --tx:#eeeef4;--s:#9a9ab0;--m:#747488;--sublabel:#9595b5;
  --nb-bg:#191920;--nb-bdr:#272730;color:#eeeef4;
}
body.light{
  --bg-shell:#e4e4ec;--bg:#f5f5f8;--card:#ffffff;--card2:#ededf2;
  --line:#e0e0ea;--blue:#3a7bd5;--purple:#7c4dcc;
  --red:#e05050;--yel:#b07800;--green:#1a8a50;
  --tx:#18181e;--s:#353550;--m:#7a7a90;--sublabel:#8888a8;
  --nb-bg:#ffffff;--nb-bdr:#e0e0ea;color:#18181e;
}
body{background:var(--bg-shell);}
#prog{position:fixed;top:0;left:0;right:0;height:2px;background:var(--line);z-index:100;}
#prog-fill{height:100%;background:linear-gradient(to right,var(--purple),var(--acc,var(--blue)));transition:width .35s ease;}

#shell{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;gap:0;}
#frame{width:100%;max-width:100%;flex:1;min-height:0;border-radius:0;overflow:hidden;}
body.dark #frame{box-shadow:0 40px 80px rgba(0,0,0,.85);}
body.light #frame{box-shadow:0 8px 40px rgba(0,0,0,.12);}
#slides{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;}
#slides::-webkit-scrollbar{width:3px;}
#slides::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
#nav{display:flex;align-items:center;gap:16px;width:100%;max-width:100%;justify-content:center;background:var(--bg);border-top:1px solid var(--line);flex-shrink:0;padding:8px 16px;position:relative;}
.nb{width:44px;height:44px;border-radius:50%;background:var(--nb-bg);border:1px solid var(--nb-bdr);color:var(--s);font-size:18px;cursor:pointer;transition:all .2s;display:grid;place-items:center;font-family:inherit;line-height:1;padding:0;}
.nb:hover{color:var(--tx);}
.nb:disabled{opacity:.2;cursor:default;}
#ctr{font-size:12px;color:var(--m);letter-spacing:1px;min-width:56px;text-align:center;}
#tts-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-size:12px;font-weight:600;color:var(--blue);opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:300;box-shadow:0 4px 20px rgba(0,0,0,.2);}
#tts-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#chat-btn{position:fixed;bottom:76px;right:16px;z-index:150;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--blue));border:none;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;transition:transform .2s;}
#chat-btn:hover{transform:scale(1.08);}
#chat-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;opacity:0;pointer-events:none;transition:opacity .3s;}
#chat-overlay.open{opacity:1;pointer-events:all;}
#chat-panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:420px;height:72vh;background:var(--bg);border-radius:20px 20px 0 0;z-index:500;display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.4,0,.2,1);border-top:1px solid var(--line);}
#chat-panel.open{transform:translateX(-50%) translateY(0);}
.chat-hd{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.chat-hd-info{display:flex;align-items:center;gap:10px;}
.chat-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--blue));display:flex;align-items:center;justify-content:center;font-size:15px;}
.chat-name{font-size:14px;font-weight:700;color:var(--tx);}
.chat-sub{font-size:11px;color:var(--m);}
.chat-close{width:32px;height:32px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--s);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.chat-msgs{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px;}
.chat-msgs::-webkit-scrollbar{width:2px;}
.msg{display:flex;flex-direction:column;gap:3px;max-width:85%;}
.msg.user{align-self:flex-end;}
.msg.ai{align-self:flex-start;}
.msg-bubble{padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.55;}
.msg.user .msg-bubble{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;border-radius:14px 14px 4px 14px;}
.msg.ai .msg-bubble{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px 14px 14px 4px;}
.msg-bubble strong{font-weight:700;}
.typing{display:flex;gap:4px;align-items:center;padding:10px 13px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--m);animation:bounce 1.2s ease infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-6px);}}
.chat-footer{padding:10px 14px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end;flex-shrink:0;}
#chat-input{flex:1;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;font-size:14px;color:var(--tx);outline:none;resize:none;max-height:100px;font-family:inherit;line-height:1.4;transition:border-color .2s;}
#chat-input:focus{border-color:var(--blue);}
#chat-input::placeholder{color:var(--m);}
#chat-send{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--purple),var(--blue));border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#chat-send:disabled{opacity:.3;cursor:default;}

/* ══ PAGES ══ */
.page{background:var(--page-bg,var(--bg));}
.pg-cover{min-height:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:40px 28px 48px;position:relative;overflow:hidden;}
.pg-cover::before{content:'';position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;background:radial-gradient(circle,rgba(110,181,255,.07),transparent 65%);pointer-events:none;}
.pg-cover::after{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(196,160,255,.06),transparent 65%);pointer-events:none;}
.cv-eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--m);margin-bottom:18px;position:relative;z-index:1;}
.cv-title{font-size:50px;font-weight:700;line-height:.92;letter-spacing:-1px;color:var(--tx);position:relative;z-index:1;}
.cv-title .acc{color:var(--blue);}
.cv-line{width:48px;height:2px;background:linear-gradient(to right,var(--blue),var(--purple));border-radius:1px;margin:20px 0 14px;position:relative;z-index:1;}
.cv-sub{font-size:14px;color:var(--s);margin-bottom:22px;position:relative;z-index:1;}
.cv-tags{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1;}
.ctag{padding:6px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--s);}
.ctag.b{color:var(--blue);border-color:rgba(110,181,255,.3);background:rgba(110,181,255,.07);}
.ctag.p{color:var(--purple);border-color:rgba(196,160,255,.3);background:rgba(196,160,255,.07);}
.pg-inst{min-height:100%;display:flex;flex-direction:column;padding:28px 24px 40px;gap:18px;}
.inst-title{font-size:22px;font-weight:700;color:var(--tx);}
.inst-shimmer{align-items:center;}
.inst-shimmer .inst-text{flex:1;}
.inst-item{display:flex;gap:14px;align-items:flex-start;}
.inst-icon{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--card);border:1px solid var(--line);}
.inst-text{display:flex;flex-direction:column;gap:3px;padding-top:4px;}
.inst-text strong{font-size:14px;font-weight:700;color:var(--tx);}
.inst-text span{font-size:13px;color:var(--s);line-height:1.5;}
.inst-demo{background:var(--card2);border-radius:12px;padding:13px 15px;border:1px solid var(--line);}
.inst-demo-txt{font-size:13px;color:var(--s);}
.inst-demo-en{color:var(--blue);font-weight:600;border-bottom:1.5px dotted var(--blue);cursor:pointer;}
.pg-idx{min-height:100%;display:flex;flex-direction:column;padding:24px 20px 36px;}
.idx-title{font-size:24px;font-weight:700;color:var(--tx);margin-bottom:4px;}
.idx-sub{font-size:11px;color:var(--m);margin-bottom:14px;}
.idx-list{display:flex;flex-direction:column;gap:0;}
.idx-cap{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--sublabel);padding:6px 2px 3px;}
.idx-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line);cursor:pointer;transition:all .2s;}
.idx-item:active{border-color:var(--acc,var(--blue));background:var(--card2);}
.idx-num{font-size:11px;font-weight:800;color:var(--m);min-width:24px;opacity:.7;}
.idx-info{flex:1;}
.idx-name{font-size:14px;font-weight:700;color:var(--tx);letter-spacing:-.1px;}
.idx-desc{font-size:12px;color:var(--m);margin-top:2px;line-height:1.4;}
.idx-arrow{font-size:13px;color:var(--m);opacity:.4;}
.pg-sec{height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:12px 28px 16px;position:relative;overflow:hidden;background:var(--bg);}
.pg-sec::before{content:'';position:absolute;top:-40px;right:-40px;width:260px;height:260px;background:radial-gradient(circle,rgba(196,160,255,.07),transparent 65%);pointer-events:none;}
.pg-sec::after{content:'';position:absolute;top:15%;right:0;width:2px;height:50%;background:linear-gradient(to bottom,transparent,var(--acc,var(--blue)),transparent);opacity:.4;}
.sec-eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--m);margin-bottom:12px;}
.sec-title{font-size:52px;font-weight:700;line-height:.92;letter-spacing:-1.5px;color:var(--tx);margin-bottom:18px;}
.sec-title .acc{color:var(--acc,var(--blue));}
.sec-sep{width:100%;height:1px;background:var(--line);margin-bottom:13px;}
.sec-desc{font-size:15px;color:var(--s);line-height:1.6;margin-bottom:20px;max-width:300px;}
.sec-lvl{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:20px;}
.lv{width:30px;height:5px;border-radius:3px;background:var(--line);}
.lv.on{background:var(--acc,var(--blue));}
.lv-lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--m);margin-left:8px;}
.pg-rev{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;gap:14px;position:relative;overflow:hidden;}
.pg-rev::before{content:'';position:absolute;top:-40px;left:-40px;width:260px;height:260px;background:radial-gradient(circle,rgba(255,213,128,.06),transparent 65%);pointer-events:none;}
.pg-rev::after{content:'';position:absolute;bottom:-40px;right:-40px;width:220px;height:220px;background:radial-gradient(circle,rgba(110,181,255,.06),transparent 65%);pointer-events:none;}
.rev-icon{font-size:56px;position:relative;z-index:1;}
.rev-title{font-size:42px;font-weight:700;line-height:.92;letter-spacing:-1.5px;color:var(--tx);position:relative;z-index:1;}
.rev-title .acc{color:var(--yel);}
.rev-line{width:48px;height:2px;background:linear-gradient(to right,var(--yel),var(--blue));border-radius:1px;position:relative;z-index:1;}
.rev-desc{font-size:15px;color:var(--s);line-height:1.6;max-width:280px;position:relative;z-index:1;}
.pg-content{display:flex;flex-direction:column;min-height:100%;background:var(--bg);}
.pg-hd{padding:22px 22px 14px;border-bottom:2px solid var(--acc,var(--blue));flex-shrink:0;}
.pg-lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--m);margin-bottom:4px;}
.pg-ttl{font-size:21px;font-weight:700;color:var(--tx);}
.pg-body{padding:20px 22px 36px;display:flex;flex-direction:column;gap:14px;}
.intro{font-size:17px;color:var(--s);line-height:1.7;}
.intro strong{color:var(--tx);font-weight:700;}
.sub-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--sublabel);margin-top:4px;}

.en.slow{border-bottom-style:dashed;}

/* To Be section cards */
.tobe-card{border-radius:13px;overflow:hidden;border:1px solid var(--line);margin-top:20px;}
body.light .tobe-card{box-shadow:0 1px 6px rgba(0,0,0,.07);}
.tobe-card-hd{padding:12px 16px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff;background:#3a7bd5;display:flex;align-items:center;gap:8px;}
.tobe-card-hd::before{content:'';width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);flex-shrink:0;}
.tobe-card-hd.red{background:#c04444;}
.tobe-card-hd.grn{background:#2d8a58;}
.tobe-card-hd.pur{background:#7040bb;}
.tobe-card-hd.yel{background:#9a6a00;}
.tobe-card-body{padding:16px 15px;display:flex;flex-direction:column;gap:13px;background:var(--card);}

/* Big conj table for to be */
.conj-big{background:var(--card2);border-radius:11px;overflow:hidden;}
.conj-big-row{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;}
.conj-big-row:last-child{border:none;}
.conj-big-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.conj-verb-main{font-size:17px;font-weight:700;color:var(--tx);}
.conj-verb-abbr{font-size:15px;font-weight:700;color:var(--blue);}
.conj-verb-abbr.red{color:var(--red);}
.conj-tr-big{font-size:13px;color:var(--s);margin-top:2px;}
.conj-who-big{font-size:12px;color:var(--m);margin-top:1px;}

/* Internal hyperlink */
.tb-link{color:var(--blue);font-weight:700;border-bottom:1.5px dashed var(--blue);cursor:pointer;display:inline;}
.tb-link:hover{opacity:.75;}

/* Highlight pulse animation */
@keyframes hpulse{0%{box-shadow:0 0 0 0 rgba(110,181,255,.6),0 0 0 0 rgba(110,181,255,.3);}50%{box-shadow:0 0 0 8px rgba(110,181,255,.2),0 0 0 16px rgba(110,181,255,.05);}100%{box-shadow:0 0 0 0 rgba(110,181,255,0),0 0 0 0 rgba(110,181,255,0);}}
.highlight-pulse{animation:hpulse 1.4s ease 3;border-color:var(--blue) !important;outline:2px solid var(--blue);outline-offset:2px;}

/* Section divider between Presente/Passado/Futuro */
.tobe-divider{display:flex;align-items:center;gap:12px;margin:10px 0 4px;}
.tobe-divider-line{flex:1;height:1px;background:var(--line);}
.tobe-divider-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--m);white-space:nowrap;}

/* Irony block */
.irony-block{background:var(--card2);border-radius:11px;padding:13px 15px;border-left:3px solid var(--yel);}
.irony-label{font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--yel);margin-bottom:7px;}
.irony-txt{font-size:13px;color:var(--s);line-height:1.6;}
.irony-txt strong{color:var(--tx);font-weight:700;}
.irony-txt em{color:var(--m);}

/* Big unified table */
.big-tbl-wrap{background:var(--card);border-radius:13px;overflow:hidden;border:1px solid var(--line);}
body.light .big-tbl-wrap{box-shadow:0 2px 12px rgba(0,0,0,.08);}
.big-tbl-wrap table{width:100%;border-collapse:collapse;}
.big-tbl-wrap th{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff;padding:10px 11px;text-align:left;border-bottom:1px solid rgba(255,255,255,.1);}
.big-tbl-wrap th.blu{background:#2a5aa0;}
.big-tbl-wrap th.red{background:#9a2a2a;}
.big-tbl-wrap td{font-size:12px;padding:10px 11px;border-bottom:1px solid var(--line);color:var(--s);line-height:1.45;vertical-align:top;}
.big-tbl-wrap tr:last-child td{border:none;}
.big-tbl-wrap td:first-child{font-weight:700;color:var(--blue);white-space:nowrap;font-size:13px;}
.big-tbl-wrap td .abbr{display:block;color:var(--blue);font-size:13px;font-weight:700;}
.big-tbl-wrap td .abbr.r{color:var(--red);}
.big-tbl-wrap td .tr{display:block;color:var(--m);font-size:11px;margin-top:2px;}


.quote-list{display:flex;flex-direction:column;gap:7px;}
.quote{border-left:2px solid var(--line);padding:6px 13px;display:flex;flex-direction:column;gap:4px;}
.q-pt{font-size:16px;color:var(--s);}
.q-pt b{color:var(--tx);}
.q-en{font-size:17px;font-weight:600;color:var(--tx);}
.q-tr{font-size:11px;color:var(--m);font-weight:400;}
.tip{background:var(--card);border-radius:11px;padding:12px 14px;border-left:2px solid var(--blue);}
body.light .tip{box-shadow:0 1px 4px rgba(0,0,0,.06);}
.tip.red{border-left-color:var(--red);}
.tip.grn{border-left-color:var(--green);}
.tip.yel{border-left-color:var(--yel);}
.tip-lbl{font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);margin-bottom:6px;}
.tip.red .tip-lbl{color:var(--red);}
.tip.grn .tip-lbl{color:var(--green);}
.tip.yel .tip-lbl{color:var(--yel);}
.tip-txt{font-size:15px;color:var(--s);line-height:1.6;}
.tip-txt strong{color:var(--tx);font-weight:700;}
.pron-table{background:var(--card);border-radius:13px;overflow:hidden;}
body.light .pron-table{box-shadow:0 1px 6px rgba(0,0,0,.07);}
.prow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);gap:8px;}
.prow:last-child{border:none;}
.prow-en{font-size:18px;font-weight:700;}
.prow-arr{font-size:12px;color:var(--m);text-align:center;}
.prow-pt{font-size:14px;color:var(--s);text-align:right;}
.pron-section{display:flex;flex-direction:column;gap:9px;}
.pron-header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.pron-word{font-size:22px;font-weight:700;color:var(--tx);}
.pron-tr{font-size:13px;color:var(--s);}
.pron-body{font-size:14px;color:var(--s);line-height:1.65;}
.pron-body strong{color:var(--tx);font-weight:700;}
.blist{display:flex;flex-direction:column;gap:7px;}
.bitem{display:flex;gap:10px;font-size:14px;color:var(--s);line-height:1.55;}
.bitem::before{content:'—';color:var(--line);flex-shrink:0;}
.bitem strong{color:var(--tx);font-weight:700;}
.bitem em{color:var(--m);font-style:italic;}
.ex-list{display:flex;flex-direction:column;gap:7px;}
.ex-ex{background:var(--card2);border-radius:9px;padding:10px 13px;display:flex;flex-direction:column;gap:4px;}
.ex-pt{font-size:13px;color:var(--s);}
.ex-en{font-size:15px;font-weight:600;color:var(--tx);}
.conj-wrap{background:var(--card);border-radius:13px;overflow:hidden;}
body.light .conj-wrap{box-shadow:0 1px 6px rgba(0,0,0,.07);}
.conj-row{display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);gap:8px;}
.conj-row:last-child{border:none;}
.conj-verb{font-size:15px;font-weight:700;color:var(--tx);}
.conj-abbr{font-size:11px;color:var(--m);font-weight:400;margin-left:4px;}
.conj-tr{font-size:10px;color:var(--m);margin-top:2px;}
.conj-who{font-size:13px;color:var(--s);text-align:right;}
.rule-list{display:flex;flex-direction:column;gap:7px;}
.rule{background:var(--card2);border-radius:9px;padding:10px 13px;display:flex;flex-direction:column;gap:4px;}
.rule-title{font-size:10px;font-weight:700;color:var(--sublabel);text-transform:uppercase;letter-spacing:1px;}
.rule-body{font-size:13px;color:var(--s);}
.rule-body strong{color:var(--tx);font-weight:700;}
.rule-ex{font-size:13px;color:var(--blue);font-weight:600;}
.tbl-wrap{background:var(--card);border-radius:13px;overflow:hidden;}
body.light .tbl-wrap{box-shadow:0 1px 6px rgba(0,0,0,.07);}
table{width:100%;border-collapse:collapse;}
th{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--m);padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);}
td{font-size:11px;padding:9px 10px;border-bottom:1px solid var(--line);color:var(--s);line-height:1.4;}
tr:last-child td{border:none;}
td:first-child{font-weight:700;color:var(--blue);white-space:nowrap;}
.game-wrap,.ex-wrap{background:var(--card);border-radius:13px;border:1px solid var(--line);overflow:hidden;}
.game-header,.ex-header{padding:11px 13px 9px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.game-title,.ex-title{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--sublabel);}
.game-score,.ex-score{font-size:13px;font-weight:700;color:var(--blue);}
.game-body,.ex-body{padding:13px 13px 14px;display:flex;flex-direction:column;gap:10px;}
.game-instruction{font-size:14px;color:var(--s);text-align:center;}
.game-instruction strong{color:var(--tx);}
.game-frase{background:var(--card2);border-radius:9px;padding:11px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:56px;align-items:center;}
.word-btn,.opt-btn{padding:8px 13px;border-radius:7px;background:var(--bg);border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--tx);cursor:pointer;transition:all .18s;user-select:none;font-family:inherit;}
.word-btn:hover,.opt-btn:hover{border-color:var(--blue);color:var(--blue);}
.word-btn.correct,.opt-btn.correct{background:rgba(125,232,160,.12);border-color:var(--green);color:var(--green);}
.word-btn.wrong,.opt-btn.wrong{animation:shake .35s ease;border-color:var(--red);color:var(--red);}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-5px);}40%{transform:translateX(5px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}
.ex-sentence{background:var(--card2);border-radius:9px;padding:12px 13px;display:flex;flex-direction:column;gap:5px;}
.ex-pt2{font-size:14px;color:var(--s);line-height:1.5;}
.ex-en-blank{font-size:17px;font-weight:600;color:var(--tx);line-height:1.6;}
.blank{display:inline-block;min-width:56px;border-bottom:2px solid var(--blue);margin:0 3px;text-align:center;color:var(--blue);}
.ex-options{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;}
.ex-feedback,.game-feedback{font-size:12px;font-weight:700;text-align:center;min-height:18px;}
.ex-feedback.ok,.game-feedback.ok{color:var(--green);}
.ex-feedback.err,.game-feedback.err{color:var(--red);}
.ex-progress,.game-progress{display:flex;gap:5px;justify-content:center;}
.ep-dot,.gp-dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .3s;}
.ep-dot.done,.gp-dot.done{background:var(--green);}
.ep-dot.current,.gp-dot.current{background:var(--blue);}
.ex-next,.game-next{padding:7px 16px;border-radius:7px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;cursor:pointer;align-self:center;display:none;border:none;font-family:inherit;}
.ex-finish,.game-finish{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0;}
.finish-emoji{font-size:36px;}
.finish-msg{font-size:17px;font-weight:700;color:var(--tx);}
.finish-sub{font-size:12px;color:var(--s);}
.ex-restart,.game-restart{padding:8px 20px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--blue);cursor:pointer;font-family:inherit;}

/* ── BACK BUTTON ── */
#inline-back-btn{display:block;margin:0 auto 10px auto;padding:7px 18px;border-radius:99px;background:var(--purple);border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;animation:fadeIn .3s ease;}
#inline-back-btn:hover{opacity:.85;}


/* ── HIGHLIGHT COLORS FOR TO GO ── */
.hl-will{color:var(--blue);font-weight:700;}
.hl-wont{color:var(--red);font-weight:700;}
.hl-go{color:var(--green);font-weight:700;}
.hl-tobe{color:var(--yel);font-weight:700;}
/* ── RULE BOX ── */
.conj-table{background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.conj-row.hd{background:var(--card);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--m);}
.conj-row.neg span:last-child{color:var(--red);font-weight:700;}
.eg-block{display:flex;flex-direction:column;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.eg-row{display:flex;flex-direction:column;gap:3px;}
.eg-pt{font-size:13px;color:var(--s);}
.eg-en{font-size:14px;font-weight:700;color:var(--tx);}
.rule-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 16px;}
.rule-title{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--blue);margin-bottom:8px;}

.pg-hd-rev{display:flex;align-items:center;gap:14px;padding:18px 22px 14px;}
.rev-icon-sm{font-size:32px;flex-shrink:0;}
.pg-hd-revtxt{display:flex;flex-direction:column;gap:2px;}
.pg-sec-body{position:relative;z-index:1;margin-top:auto;}
.pg-sec-num{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--acc,var(--blue));margin-bottom:10px;}
.pg-sec-title{font-size:48px;font-weight:700;line-height:.95;letter-spacing:-1.5px;color:var(--tx);margin-bottom:14px;}
.pg-sec-sub{font-size:15px;color:var(--s);margin-bottom:4px;}
.rev-big-hd{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 28px 24px;gap:12px;position:relative;}
.rev-big-hd::before{content:'';position:absolute;top:-40px;left:-40px;width:260px;height:260px;background:radial-gradient(circle,rgba(255,213,128,.07),transparent 65%);pointer-events:none;}
.rev-big-icon{font-size:52px;}
.rev-big-title{font-size:38px;font-weight:700;line-height:.95;letter-spacing:-1.5px;color:var(--tx);}
.rev-acc{color:var(--yel);}
.rev-big-line{width:48px;height:2px;background:linear-gradient(to right,var(--yel),var(--blue));border-radius:1px;}
.rev-big-desc{font-size:14px;color:var(--s);line-height:1.6;max-width:280px;}
.pg-chapter{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#0d1a2e 0%,#162040 50%,#1a0d2e 100%);position:relative;overflow:hidden;}
body.light .pg-chapter{background:linear-gradient(135deg,#1a3060 0%,#2a4a8a 50%,#2a1a5e 100%);}
.pg-chapter::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(110,181,255,.08),transparent 60%),radial-gradient(ellipse at 70% 50%,rgba(196,160,255,.06),transparent 60%);pointer-events:none;}
.ch-eyebrow{font-size:12px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:12px;position:relative;z-index:1;}
.ch-num{font-size:96px;font-weight:900;line-height:1;color:#fff;letter-spacing:-4px;position:relative;z-index:1;text-shadow:0 0 60px rgba(110,181,255,.3);}

.sp-toggle{width:44px;height:24px;border-radius:99px;border:none;cursor:pointer;transition:all .25s;flex-shrink:0;position:relative;outline:none;}
.sp-toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s;}
.sp-toggle.on{background:var(--acc,var(--blue));}
.sp-toggle.off{background:var(--line);}
.sp-toggle.on::after{transform:translateX(20px);}
.ch-idx-btn{position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:2;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.5px;padding:8px 20px;border-radius:99px;cursor:pointer;transition:all .2s;}
.ch-idx-btn:hover{background:rgba(255,255,255,.2);color:#fff;}
.hd-idx-btn{margin-top:6px;background:none;border:none;color:var(--m);font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.5px;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px;transition:color .2s;}
.hd-idx-btn:hover{color:var(--acc,var(--blue));}
.pg-soon{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px;gap:18px;}
.soon-icon{font-size:52px;}
.soon-title{font-size:38px;font-weight:700;line-height:.95;letter-spacing:-1.5px;color:var(--tx);}
.soon-acc{color:var(--acc,var(--blue));}
.soon-line{width:48px;height:2px;background:linear-gradient(to right,var(--acc,var(--blue)),var(--purple));border-radius:1px;}
.soon-desc{font-size:14px;color:var(--s);line-height:1.7;max-width:280px;}
.idx-search-wrap{display:flex;align-items:center;gap:8px;background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0 8px;transition:border-color .2s;}
.idx-search-wrap:focus-within{border-color:var(--acc,var(--blue));}
.idx-search-icon{font-size:15px;flex-shrink:0;opacity:.5;}
.idx-search{flex:1;background:none;border:none;outline:none;font-family:inherit;font-size:15px;color:var(--tx);}
.idx-search::placeholder{color:var(--m);}
.idx-search-clear{background:none;border:none;color:var(--m);font-size:13px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;}
.idx-noresult{text-align:center;color:var(--m);font-size:14px;padding:24px 0;}
.idx-item[data-hidden]{display:none;}
.idx-group[data-hidden]{display:none;}
.tl-result-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;}
.tl-result-row:last-child{margin-bottom:0;}
.tl-speak-btn{background:none;border:none;font-size:16px;cursor:pointer;flex-shrink:0;padding:0;line-height:1;opacity:.7;transition:opacity .2s;}
.tl-speak-btn:hover{opacity:1;}
.ex-explain-btn{background:none;border:none;color:var(--acc,var(--blue));font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:6px 0 0;display:block;text-decoration:underline;}

.tag-pill{display:inline-flex;align-items:center;font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.5px;padding:3px 10px;border-radius:20px;margin-right:6px;flex-shrink:0;white-space:nowrap;}
.tag-pill.in{background:rgba(99,179,237,.15);color:#63b3ed;border:1px solid rgba(99,179,237,.3);}
.tag-pill.on{background:rgba(154,230,180,.15);color:#68d391;border:1px solid rgba(154,230,180,.3);}
.tag-pill.at{background:rgba(252,176,69,.15);color:#f6ad55;border:1px solid rgba(252,176,69,.3);}
.tip-list{display:flex;flex-direction:column;gap:10px;margin:12px 0;}
.tip-list-item{display:flex;align-items:flex-start;gap:6px;font-size:13px;color:var(--s);line-height:1.6;}
.idx-chapter{border-radius:16px;overflow:hidden;margin-bottom:8px;border:1.5px solid var(--line);background:var(--card);}
.idx-chapter-btn{width:100%;display:flex;align-items:center;gap:12px;padding:16px 18px;background:none;border:none;cursor:pointer;text-align:left;transition:background .2s;}
.idx-chapter-btn:active{background:var(--card2);}
.idx-chapter-num{width:32px;height:32px;border-radius:10px;background:var(--ch-color,var(--acc,var(--blue)));color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.idx-chapter-title{flex:1;font-size:15px;font-weight:700;color:var(--tx);letter-spacing:-.2px;}
.idx-chapter-arrow{font-size:14px;color:var(--m);transition:transform .25s;flex-shrink:0;opacity:.6;}
.idx-chapter.closed .idx-chapter-arrow{transform:rotate(-90deg);}
.idx-chapter-body{display:flex;flex-direction:column;gap:5px;padding:0 10px 10px;}
.idx-chapter.closed .idx-chapter-body{display:none;}
.idx-chapter-body{border-top:1px solid var(--line);margin-top:0;}
.the-hl{color:var(--acc,var(--blue));font-weight:700;}

.inonat-group{display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:4px;}
.inonat-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);gap:12px;}
.inonat-item:last-child{border-bottom:none;}
.inonat-desc{font-size:15px;color:var(--s);flex:1;line-height:1.4;}

.inonat-prep.in{background:rgba(99,179,237,.15);color:#63b3ed;}
.inonat-prep.on{background:rgba(154,230,180,.15);color:#68d391;}
.inonat-prep.at{background:rgba(252,176,69,.15);color:#f6ad55;}

.inonat-section-label{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--acc,var(--blue));margin:18px 0 6px;padding:0 2px;}

.inonat-tip-click{font-size:12px;color:var(--m);line-height:1.4;}
.inonat-list{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
.inonat-bubble{border-radius:14px;border:1.5px solid var(--line);background:var(--card);overflow:hidden;}
.inonat-bubble-btn{width:100%;display:flex;align-items:center;gap:10px;padding:13px 16px;background:none;border:none;cursor:pointer;text-align:left;}
.inonat-bubble-title{flex:1;font-size:15px;color:var(--s);font-weight:600;line-height:1.4;}
.inonat-bubble-prep{font-size:14px;font-weight:800;padding:3px 12px;border-radius:20px;flex-shrink:0;}
.inonat-bubble-prep.in{background:rgba(99,179,237,.15);color:#63b3ed;}
.inonat-bubble-prep.on{background:rgba(154,230,180,.15);color:#68d391;}
.inonat-bubble-prep.at{background:rgba(252,176,69,.15);color:#f6ad55;}
.inonat-bubble-arrow{font-size:13px;color:var(--m);transition:transform .2s;flex-shrink:0;opacity:.6;}
.inonat-bubble.open .inonat-bubble-arrow{transform:rotate(180deg);}
.inonat-bubble-body{display:none;padding:0 16px 14px;border-top:1px solid var(--line);}

.inonat-note{font-size:14px;color:var(--m);font-style:italic;margin:10px 0 8px;line-height:1.5;}
.inonat-ex{margin-top:8px;}
.inonat-ex-en{display:block;font-size:15px;font-weight:600;color:var(--tx);}
.inonat-ex-pt{display:block;font-size:14px;color:var(--m);margin-top:1px;}
.demo-list{display:flex;flex-direction:column;gap:10px;}
.demo-item{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:0;position:relative;overflow:hidden;}
.demo-item.demo-perto{border-color:rgba(99,179,237,.35);}
.demo-item.demo-perto::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#63b3ed,#93c5fd);}
.demo-item.demo-longe{border-color:rgba(104,211,145,.35);}
.demo-item.demo-longe::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#68d391,#a0e6b0);}
.demo-badge{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 10px;border-radius:20px;}
.demo-item.demo-perto .demo-badge{background:rgba(99,179,237,.12);color:#63b3ed;}
.demo-item.demo-longe .demo-badge{background:rgba(104,211,145,.12);color:#68d391;}
.demo-header{display:flex;align-items:center;gap:10px;padding-right:65px;margin-bottom:12px;}
.demo-pt{font-size:15px;font-weight:600;color:var(--s);flex:1;min-width:0;}
.demo-eq{font-size:13px;color:var(--m);opacity:.5;flex-shrink:0;}
.demo-en{font-size:24px;font-weight:800;color:var(--acc,var(--blue));flex-shrink:0;letter-spacing:-.5px;}

.demo-example{background:var(--card2);border-radius:10px;padding:11px 14px;}

.demo-example .q-en{font-size:15px;font-weight:700;color:var(--tx);}
.indem-decomp-list{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:0;margin:16px 0;overflow:hidden;}
.indem-decomp-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:700;}
.indem-decomp-row:last-child{border-bottom:none;padding-bottom:0;}
.indem-decomp-row:first-child{padding-top:0;}
.indem-word{color:var(--acc,var(--blue));min-width:90px;}
.indem-eq{color:var(--m);font-weight:400;}
.indem-em{color:#f6ad55;}
.indem-plus{color:var(--m);font-weight:400;}
.indem-demo{color:#68d391;}
.indem-examples{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.indem-ex-block{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;}
.indem-ex-line{font-size:16px;line-height:1.6;}
.indem-ex-line.pt{color:var(--m);}
.indem-ex-line.decomp{color:var(--m);font-size:15px;opacity:.8;}
.indem-ex-line.en{font-size:17px;font-weight:600;color:var(--tx);margin-top:3px;padding-top:6px;border-top:1px solid var(--line);}
.indem-hl-word{color:var(--acc,var(--blue));font-weight:700;}
.indem-hl-em{color:#f6ad55;font-weight:700;}
.indem-hl-demo{color:#68d391;font-weight:700;}
.indem-hl-result{color:var(--acc,var(--blue));font-weight:800;}
.que-summary{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
.que-card{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;border:1.5px solid transparent;}
.que-card-that{background:rgba(246,173,85,.1);border-color:rgba(246,173,85,.3);}
.que-card-who{background:rgba(99,179,237,.1);border-color:rgba(99,179,237,.3);}

.que-card-who .que-card-en{color:#63b3ed;}

.que-card-desc{font-size:14px;color:var(--m);}
.que-ex-block{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.que-ex-pt{font-size:16px;color:var(--m);margin-bottom:2px;}
.que-ex-en{font-size:17px;font-weight:600;color:var(--tx);}

.que-subj{color:#63b3ed;font-weight:700;}
.que-subj-obj{color:#fc8181;font-weight:700;}
.que-that{color:#f6ad55;font-weight:800;}
.que-who{color:#63b3ed;font-weight:800;}
.que-which{color:#fc8181;font-weight:800;}

/* ════════════════════════════════════════
   THEMES — 10 temas · dark e light
   Standard não precisa de classe extra
════════════════════════════════════════ */

/* ── OCEAN ── */
body.t-ocean.dark{--bg:#060e1a;--bg-shell:#040a12;--card:#0c1a2e;--card2:#101e34;--line:#162440;--blue:#38bdf8;--purple:#818cf8;--green:#34d399;--red:#f87171;--yel:#fbbf24;--tx:#c8e0f8;--s:#6090b8;--m:#3a6080;--sublabel:#5080a0;}
body.t-ocean.dark .page{background:radial-gradient(ellipse at 20% 0%,#0a3060 0%,transparent 55%),linear-gradient(180deg,#061428 0%,#020810 100%);}
body.t-ocean.light{--bg:#f0f9ff;--bg-shell:#e0f2fe;--card:#fff;--card2:#e0f2fe;--line:#bae6fd;--blue:#0284c7;--purple:#7c3aed;--green:#059669;--red:#dc2626;--yel:#d97706;--tx:#082840;--s:#1a5070;--m:#4a90a8;--sublabel:#5090a0;}

.tsheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:800;opacity:0;transition:opacity .25s;}
#theme-sheet{position:fixed;inset:0;z-index:801;pointer-events:none;}
#theme-sheet.open{pointer-events:all;}
#theme-sheet.open .tsheet-backdrop{opacity:1;}
.tsheet-panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:420px;background:var(--card);border-radius:24px 24px 0 0;padding:20px 16px 32px;transition:transform .3s cubic-bezier(.32,.72,0,1);z-index:802;}
#theme-sheet.open .tsheet-panel{transform:translateX(-50%) translateY(0);}
.tsheet-title{font-size:14px;font-weight:800;color:var(--tx);text-align:center;margin-bottom:16px;}
.tsheet-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.tsheet-item{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:2px solid transparent;border-radius:14px;padding:8px 4px;cursor:pointer;transition:all .2s;font-family:inherit;}
.tsheet-item:active{transform:scale(.95);}
.tsheet-active{border-color:var(--blue);}
.tsheet-swatch{width:36px;height:36px;border-radius:50%;flex-shrink:0;}
.tsheet-lbl{font-size:10px;font-weight:700;color:var(--m);white-space:nowrap;}
.tsheet-active .tsheet-lbl{color:var(--blue);}
.sec-theme-btn,.sec-mode-btn{border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-family:inherit;font-size:11px;font-weight:600;color:var(--m);background:transparent;cursor:pointer;transition:all .2s;opacity:.7;}
.sec-theme-btn:active,.sec-mode-btn:active{opacity:.4;}
.sec-btns-row{display:flex;gap:6px;justify-content:center;margin-top:10px;}

.tools-theme-row{display:flex;gap:6px;padding:0 0 14px;}
.inst-prefs-btns{display:flex;gap:8px;margin-bottom:10px;}
.inst-theme-btn{border:none;border-radius:14px;padding:14px 20px;font-family:inherit;font-size:14px;font-weight:700;color:#fff;background:var(--blue);cursor:pointer;width:100%;display:block;box-shadow:0 4px 14px rgba(0,0,0,.25);letter-spacing:.2px;}
.inst-mode-btn{border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-family:inherit;font-size:12px;font-weight:700;color:var(--s);background:var(--card2);cursor:pointer;}
.sec-back-btn{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:20px;font-family:inherit;font-size:12px;font-weight:700;color:var(--m);cursor:pointer;padding:7px 16px;margin-bottom:auto;align-self:flex-start;}
.poss-pt-list{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;font-size:17px;color:var(--s);}
.poss-hl-adj{color:var(--blue);font-weight:700;}
.poss-hl-pp{color:var(--purple);font-weight:700;}
.poss-tipos-row{display:flex;gap:10px;margin:4px 0 12px;}
.poss-tipo{flex:1;border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
.poss-tipo.ppa{background:rgba(99,179,237,.08);border:1.5px solid rgba(99,179,237,.25);}
.poss-tipo.pp{background:rgba(196,160,255,.08);border:1.5px solid rgba(196,160,255,.25);}
.poss-tipo-sigla{font-size:22px;font-weight:800;}
.poss-tipo.ppa .poss-tipo-sigla{color:var(--blue);}
.poss-tipo.pp .poss-tipo-sigla{color:var(--purple);}
.poss-tipo-nome{font-size:11px;color:var(--m);line-height:1.4;}
.poss-arrow-list{display:flex;flex-direction:column;gap:0;background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;}
.poss-arrow-row{display:flex;align-items:center;gap:8px;padding:13px 18px;border-bottom:1px solid var(--line);}
.poss-arrow-row:last-child{border-bottom:none;}
.poss-arrow-pt{font-size:16px;color:var(--s);flex:1;}
.poss-arrow-line{font-size:16px;color:var(--blue);flex-shrink:0;}
.poss-arrow-en{font-size:20px;font-weight:800;color:var(--blue);flex-shrink:0;min-width:70px;text-align:right;}
.poss-triple-table{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;}
.poss-triple-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;padding:11px 16px;border-bottom:1px solid var(--line);gap:4px;align-items:center;}
.poss-triple-row:last-child{border-bottom:none;}
.poss-triple-row.hd{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--m);padding:10px 16px;background:var(--card2);}
.poss-triple-row span:first-child{font-size:15px;color:var(--s);}
.poss-triple-row .ppa{font-size:17px;font-weight:800;color:var(--blue);text-align:center;display:flex;justify-content:center;}
.poss-triple-row .pp{font-size:17px;font-weight:800;color:var(--purple);text-align:center;display:flex;justify-content:center;}
.poss-triple-row.hd span{display:flex;justify-content:center;}
.poss-triple-row.hd span:first-child{justify-content:flex-start;}
.poss-triple-row.hd .poss-hl-adj{color:var(--blue);}
.poss-triple-row.hd .poss-hl-pp{color:var(--purple);}
.poss-hl-noun{color:var(--yel);font-weight:700;}
.poss-hl-tobe{color:var(--green);font-weight:700;}
.poss-legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.poss-legend-item{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.poss-legend-item.adj{background:rgba(99,179,237,.12);color:var(--blue);}
.poss-legend-item.noun{background:rgba(255,213,128,.12);color:var(--yel);}
.poss-legend-item.tobe{background:rgba(125,232,160,.12);color:var(--green);}
.poss-ex-list{display:flex;flex-direction:column;gap:10px;}
.poss-ex-block{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;display:flex;}
.poss-ex-tag{writing-mode:vertical-rl;text-orientation:mixed;font-size:10px;font-weight:800;letter-spacing:1px;padding:12px 8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.poss-ex-tag.ppa-tag{background:rgba(99,179,237,.12);color:var(--blue);}
.poss-ex-tag.pp-tag{background:rgba(196,160,255,.12);color:var(--purple);}
.poss-ex-sentences{padding:12px 14px;display:flex;flex-direction:column;gap:5px;flex:1;}
.poss-ex-sent{font-size:17px;font-weight:600;}
.poss-ex-sent.en{font-size:16px;}
.poss-ex-note{font-size:14px;color:var(--m);line-height:1.5;padding:4px 0;}
.q-note{font-size:14px;color:var(--m);margin:4px 0;line-height:1.5;}
.q-note{font-size:12px;color:var(--m);margin:4px 0;font-style:italic;line-height:1.5;}
.sec-ghost{position:absolute;top:-20px;right:-8px;font-size:160px;font-weight:900;color:rgba(255,255,255,.03);letter-spacing:-8px;line-height:1;pointer-events:none;user-select:none;z-index:0;}
.pg-sec>*:not(.sec-ghost){position:relative;z-index:1;}
.cp-formula{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
.cp-formula-label{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--m);margin-bottom:10px;}
.cp-formula-body{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.cp-f-dono{font-size:15px;font-weight:800;color:var(--blue);}
.cp-f-dono2{font-size:15px;font-weight:800;color:var(--purple);}
.cp-f-op{font-size:17px;font-weight:900;color:var(--yel);}
.cp-f-plus{font-size:13px;color:var(--m);}
.cp-f-posse{font-size:15px;font-weight:800;color:var(--green);}
.en .cp-f-dono,.q-en .cp-f-dono{color:var(--blue) !important;background:none !important;-webkit-text-fill-color:var(--blue) !important;animation:none !important;}
.en .cp-f-dono2,.q-en .cp-f-dono2{color:var(--purple) !important;background:none !important;-webkit-text-fill-color:var(--purple) !important;animation:none !important;}
.en .cp-f-op,.q-en .cp-f-op{color:var(--yel) !important;background:none !important;-webkit-text-fill-color:var(--yel) !important;animation:none !important;}
.en .cp-f-posse,.q-en .cp-f-posse{color:var(--green) !important;background:none !important;-webkit-text-fill-color:var(--green) !important;animation:none !important;}
.cp-expr-list{display:flex;flex-direction:column;gap:8px;}
.cp-expr-item{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;}
.cp-expr-pt{font-size:12px;color:var(--m);margin-bottom:2px;}
.cp-expr-en{font-size:17px;font-weight:800;color:var(--blue);margin-bottom:6px;}
.cp-expr-ex{font-size:13px;color:var(--s);font-style:italic;}
.sec-topbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.sec-topbar-right{display:flex;gap:6px;}
.nb-sm{width:36px;height:36px;font-size:14px;}
.nb-idx{position:absolute;left:16px;}
.sec-lvl-bars{display:flex;gap:10px;align-items:center;}
.sec-mid{display:flex;flex-direction:column;justify-content:center;flex:1;min-height:0;overflow:hidden;}
.ex-start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 0;}
.ex-best{font-size:13px;color:var(--yel);font-weight:700;}
.ex-start-btn{background:var(--acc,var(--blue));color:#fff;border:none;border-radius:24px;padding:14px 36px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;}
.ex-timer{font-size:13px;font-weight:700;color:var(--m);text-align:right;padding:0 0 6px;letter-spacing:.5px;font-variant-numeric:tabular-nums;}
.finish-time{font-size:18px;font-weight:800;color:var(--blue);margin:8px 0 4px;}
.finish-compare{font-size:13px;color:var(--m);margin-bottom:8px;}
.finish-compare.ok{color:var(--green);font-weight:700;}
.finish-compare.slow{color:var(--red);}
/* ── LOGO WATERMARK ── */
.pg-watermark{position:absolute;top:14px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:0;}
.pg-watermark img{width:52px;height:52px;opacity:.13;}
.pg-cover-logo{position:relative;z-index:1;margin-bottom:16px;display:flex;justify-content:flex-start;}
.pg-cover-logo img{width:140px;height:140px;}

/* ── CURIOSIDADE ── */
.curiosidade{flex-shrink:0;background:none;border:none;padding:0;display:flex;flex-direction:column;}
body.light .curiosidade{background:rgba(255,255,255,.5);border-color:rgba(0,0,0,.08);}

.curiosidade-body{display:flex;gap:10px;align-items:flex-start;padding:4px 0;}
.curiosidade-icon{font-size:20px;flex-shrink:0;line-height:1.2;}
.curiosidade-text{display:flex;flex-direction:column;gap:3px;}
.curiosidade-label{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.5);}
body.light .curiosidade-label{color:rgba(0,0,0,.4);}
.curiosidade-fact{font-size:11px;color:rgba(255,255,255,.85);line-height:1.5;}
body.light .curiosidade-fact{color:rgba(0,0,0,.7);}
.curiosidade-fact strong{color:#fff;font-weight:700;}
body.light .curiosidade-fact strong{color:#000;}

/* ── TTS ── */
const ttsC=new Map();
function speak(w,el){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const n=(ttsC.get(w)||0)+1;ttsC.set(w,n);
  const slow=n%2===0;
  const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=slow?.45:.9;
  document.querySelectorAll('.en').forEach(e=>e.classList.remove('slow'));
  if(el&&slow)el.classList.add('slow');
  const t=document.getElementById('tts-toast');
  document.getElementById('toast-word').textContent=slow?w+' 🐢':w;
  t.classList.add('show');u.onend=()=>t.classList.remove('show');
  setTimeout(()=>t.classList.remove('show'),2500);
  window.speechSynthesis.speak(u);
}
document.addEventListener('click',e=>{const el=e.target.closest('.en');if(el)speak(el.dataset.speak||el.textContent.trim(),el);});

function toggleChat(){chatOpen?closeChat():openChat();}
function openChat(){chatOpen=true;document.getElementById('chat-panel').classList.add('open');document.getElementById('chat-overlay').classList.add('open');document.getElementById('chat-btn').textContent='✕';if(!chatH.length)addMsg('ai','Olá! 👋 Pode me perguntar qualquer dúvida de inglês da apostila. Sou uma IA e posso cometer erros — em caso de dúvidas, consulte o professor.');}
function closeChat(){chatOpen=false;document.getElementById('chat-panel').classList.remove('open');document.getElementById('chat-overlay').classList.remove('open');document.getElementById('chat-btn').textContent='💬';}
function addMsg(r,txt){const msgs=document.getElementById('chat-msgs');const d=document.createElement('div');d.className='msg '+r;const fmt=txt.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');d.innerHTML=`<div class="msg-bubble">${fmt}</div>`;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
function addTyping(){const msgs=document.getElementById('chat-msgs');const d=document.createElement('div');d.className='msg ai';d.id='typ';d.innerHTML='<div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
function remTyping(){const t=document.getElementById('typ');if(t)t.remove();}
async function sendMsg(){
  const inp=document.getElementById('chat-input');const txt=inp.value.trim();if(!txt)return;
  inp.value='';inp.style.height='auto';document.getElementById('chat-send').disabled=true;
  addMsg('user',txt);chatH.push({role:'user',content:txt});addTyping();
  try{
    const msgs=[{role:'user',content:'[SYSTEM: '+SYS+']\n\nHistórico:\n'+chatH.slice(-6).map(m=>m.role+': '+m.content).join('\n')+'\n\nAluno: '+chatH[chatH.length-1].content}];
    const r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:msgs[0].content})});
    const data=await r.json();remTyping();
    const rep=data.text||data.error||'Erro. Tente de novo.';
    chatH.push({role:'assistant',content:rep});addMsg('ai',rep);
  }catch(e){remTyping();addMsg('ai','Ops! Erro de conexão: '+e.message);}
  document.getElementById('chat-send').disabled=false;
}
function chatKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}

function scrollAndHighlight(anchor){
  window._backPage=cur;
  window._backAnchor=null;
  // Store current scroll anchor if possible
  const curAnchors=document.querySelectorAll('[id]');
  const parts=anchor.split(':');
  if(parts.length===2){
    goAndHighlight(parseInt(parts[0]),parts[1]);
  } else {

    const old=document.getElementById('inline-back-btn');if(old)old.remove();
    const btn=document.createElement('button');
    btn.id='inline-back-btn';btn.innerHTML='← Voltar';btn.className='inline-back-btn';
    btn.onclick=()=>{
      btn.remove();
      if(window._backPage!==undefined){
        go(window._backPage);
        if(window._backAnchor){
          setTimeout(()=>{
            const el=document.getElementById(window._backAnchor);
            if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
          },200);
        }
      } else {
        const allEx=document.querySelectorAll('[id$="-body"]');
        let exEl=null;
        allEx.forEach(el=>{if(el.querySelector('.opt-btn'))exEl=el;});
        if(exEl)exEl.scrollIntoView({behavior:'smooth',block:'center'});
      }
    };
    el.parentNode.insertBefore(btn,el);
    btn.scrollIntoView({behavior:'smooth',block:'center'});
    // Highlight the whole block — walk up to nearest rule-box, tip, or pron-section
    let target=el;
    while(target.parentElement&&!target.classList.contains('rule-box')&&!target.classList.contains('tip')&&!target.classList.contains('pron-section')&&!target.classList.contains('tobe-card')&&!target.classList.contains('pg-body')){

    }

    setTimeout(()=>target.classList.remove('highlight-pulse'),5000);
  }

`<div class="page pg-content" style="--acc:#63b3ed;">
  <div class="pg-hd"><div class="pg-lbl">Seção 01 · Pronomes Pessoais</div><div class="pg-ttl">O que são?</div></div>
  <div class="pg-body">
    <p class="intro" id="pron-intro">Pronomes pessoais são palavras que entram no lugar dos nomes — de pessoas, animais ou objetos — para evitar que a gente fique repetindo a mesma palavra toda hora.</p>
    <div class="quote-list">
      <div class="quote"><div class="q-pt">O <b>Ryan</b> foi ao mercado. O <b>Ryan</b> comprou café. O <b>Ryan</b> voltou pra casa.</div><div class="q-pt">O Ryan foi ao mercado. <b>Ele</b> comprou café. <b>Ele</b> voltou pra casa.</div></div>
      <div class="quote"><div class="q-pt">A <b>Ashley e a Megan</b> estão no shopping. A <b>Ashley e a Megan</b> são melhores amigas.</div><div class="q-pt">A Ashley e a Megan estão no shopping. <b>Elas</b> são melhores amigas.</div></div>
    </div>
    <div class="sub-label" id="pron-tabela">Os 7 pronomes</div>
    <div class="pron-table">
      <div class="prow"><div class="prow-en"><span class="en" data-speak="I">I</span></div><div class="prow-arr">—</div><div class="prow-pt">Eu</div></div>
      <div class="prow"><div class="prow-en"><span class="en" data-speak="You">You</span></div><div class="prow-arr">—</div><div class="prow-pt">Você / Vocês</div></div>
      <div class="prow"><div class="prow-en"><span class="en" data-speak="He">He</span></div><div class="prow-arr">—</div><div class="prow-pt">Ele</div></div>
      <div class="prow"><div class="prow-en"><span class="en" data-speak="She">She</span></div><div class="prow-arr">—</div><div class="prow-pt">Ela</div></div>
      <div class="prow"><div class="prow-en"><span class="en" data-speak="It">It</span></div><div class="prow-arr">—</div><div class="prow-pt">Ele / Ela (sem gênero)</div></div>
      <div class="prow"><div class="prow-en"><span class="en" data-speak="We">We</span></div><div class="prow-arr">—</div><div class="prow-pt">Nós</div></div>
      <div class="prow"><div class="prow-en"><span class="en" data-speak="They">They</span></div><div class="prow-arr">—</div><div class="prow-pt">Eles / Elas</div></div>
    </div>
    <div class="tip" id="pron-i"><div class="tip-lbl">📌 I — Sempre maiúsculo</div><p class="tip-txt">O pronome <strong>I</strong> (Eu) é sempre escrito com letra maiúscula em inglês, não importa a posição que ele ocupe na frase.<br><br>
      <span class="en" data-speak="I am happy">I am happy.</span> ✅ &nbsp;·&nbsp; <span style="color:var(--red)">i am happy.</span> ❌<br>
      <span class="en" data-speak="She and I are friends">She and I are friends.</span> ✅ &nbsp;·&nbsp; <span style="color:var(--red)">she and i are friends.</span> ❌</p></div>

    <div class="pron-section" id="you-plural-section">
      <div class="pron-header"><span class="pron-word"><span class="en" data-speak="You">You</span></span><span class="pron-tr">— Você / Vocês</span></div>
      <p class="pron-body">É utilizado tanto no singular (você) quanto no plural (vocês). Quando queremos deixar claro que estamos falando no plural, usamos uma destas terminações:</p>
      <div class="blist">
        <div class="bitem"><span><strong><span class="en" data-speak="You three need to wait here">You three:</span></strong> <em>Vocês três precisam esperar aqui.</em></span></div>
        <div class="bitem"><span><strong><span class="en" data-speak="You both are right">You both:</span></strong> <em>Vocês dois estão certos.</em></span></div>
        <div class="bitem"><span><strong><span class="en" data-speak="You all are invited">You all:</span></strong> <em>Vocês todos estão convidados.</em></span></div>
        <div class="bitem"><span><strong><span class="en" data-speak="You guys are cool">You guys:</span></strong> <em>Vocês caras são firmeza.</em></span></div>
      </div>
    </div>
    <div class="pron-section" id="pron-it">
      <div class="pron-header"><span class="pron-word"><span class="en" data-speak="It">It</span></span><span class="pron-tr">— Ele / Ela (sem gênero)</span></div>
      <p class="pron-body">O <strong>It</strong> é utilizado quando "ele" ou "ela" é algo não-humano e que não possui gênero — objetos e fenômenos da natureza. Para animais, se você souber o gênero, pode usar <strong>he</strong> ou <strong>she</strong>.</p>
      <div class="ex-list">
        <div class="ex-ex"><div class="ex-pt">Ele (computador) está muito lento.</div><div class="ex-en"><span class="en" data-speak="It is very slow">It is very slow.</span></div></div>
        <div class="ex-ex"><div class="ex-pt">Ela (pantufa) estava embaixo da cama.</div><div class="ex-en"><span class="en" data-speak="It was under the bed">It was under the bed.</span></div></div>
      </div>
    </div>
    <div class="pron-section" id="pron-they">
      <div class="pron-header"><span class="pron-word"><span class="en" data-speak="They">They</span></span><span class="pron-tr">— Eles / Elas / Pronome Neutro</span></div>
      <p class="pron-body">No plural, o <strong>They</strong> pode ser usado para pessoas ou objetos.</p>
      <div class="blist">
        <div class="bitem"><span><strong>Humano:</strong> <span class="en" data-speak="They are my favorite teachers">They are my favorite teachers.</span> <em>(Eles são meus professores favoritos.)</em></span></div>
        <div class="bitem"><span><strong>Não-humano:</strong> <span class="en" data-speak="I love these shoes, they are so comfortable">I love these shoes, they are so comfortable.</span> <em>(Eles são muito confortáveis.)</em></span></div>
      </div>
      <p class="pron-body">O <strong>they</strong> também é usado para se referir a uma pessoa específica quando o gênero não foi mencionado ou não é conhecido — equivale a "ele ou ela".</p>
      <div class="ex-list">
        <div class="ex-ex"><div class="ex-pt">Alguém ligou. Ele ou ela deixou recado.</div><div class="ex-en"><span class="en" data-speak="Someone called. They left a message.">Someone called. They left a message.</span></div></div>
        <div class="ex-ex"><div class="ex-pt">O novo funcionário começa amanhã. Ele ou ela parece legal.</div><div class="ex-en"><span class="en" data-speak="The new employee starts tomorrow. They seem nice.">The new employee starts tomorrow. They seem nice.</span></div></div>
      </div>
    </div>
    <div class="sub-label">Pratique</div>
    <div class="game-wrap"><div class="game-header"><span class="game-title">Pronomes</span><span class="game-score" id="pron-score">0/7</span></div><div class="game-body" id="pron-body"></div></div>
  </div>
</div>`,

`<div class="page pg-content" style="--acc:#a78bfa;">
  <div class="pg-hd"><div class="pg-lbl">Seção 03 · Continuous Tenses</div><div class="pg-ttl">O -ndo em inglês</div></div>
  <div class="pg-body">
    <p class="intro">Quando queremos dizer que uma ação <strong>está acontecendo</strong> — ou estava, ou vai estar — acrescentamos <strong>-ing</strong> ao final do verbo em inglês. É o mesmo que o <strong>-ndo</strong> do português.</p>
    <div class="quote-list">
      <div class="quote"><div class="q-pt">Eu estou dormi<b>ndo</b>.</div><div class="q-en"><span class="en" data-speak="I am sleeping">I am sleepi<b>ng</b>.</span></div></div>
      <div class="quote"><div class="q-pt">Ela estava come<b>ndo</b>.</div><div class="q-en"><span class="en" data-speak="She was eating">She was eati<b>ng</b>.</span></div></div>
      <div class="quote"><div class="q-pt">Nós não vamos estar joga<b>ndo</b>.</div><div class="q-en"><span class="en" data-speak="We won't be playing">We won't be playi<b>ng</b>.</span></div></div>
      <div class="quote"><div class="q-pt">Eles não estavam pula<b>ndo</b>.</div><div class="q-en"><span class="en" data-speak="They weren't jumping">They weren't jumpi<b>ng</b>.</span></div></div>
    </div>
    <p class="intro">O <strong>-ing</strong> aparece em outras situações também, que vamos ver mais pra frente. Mas uma coisa é certa: sempre que você ver um <strong>-ndo</strong> em português, vai ser <strong>-ing</strong> em inglês.</p>
    <div class="sub-label">Regras do -ing</div>
    <div class="rule-list">
      <div class="rule"><div class="rule-title" id="ing-regras">Verbo termina em -e</div><div class="rule-body">Tira o <strong>e</strong> antes do <strong>-ing</strong></div><div class="rule-ex"><span class="en" data-speak="make">make</span> (fazer) → <span class="en" data-speak="making">mak<b>ing</b></span> &nbsp;·&nbsp; <span class="en" data-speak="write">write</span> (escrever) → <span class="en" data-speak="writing">writ<b>ing</b></span></div></div>
      <div class="rule"><div class="rule-title">Verbo curto (consoante–vogal–consoante)</div><div class="rule-body">Dobra a última letra</div><div class="rule-ex"><span class="en" data-speak="run">run</span> (correr) → <span class="en" data-speak="running">runn<b>ing</b></span> &nbsp;·&nbsp; <span class="en" data-speak="sit">sit</span> (sentar) → <span class="en" data-speak="sitting">sitt<b>ing</b></span></div></div>
    </div>
    <div class="tip"><div class="tip-lbl">📝 Só na escrita</div><p class="tip-txt">Essas regras são relevantes só na <strong>escrita</strong> — na fala, ninguém vai notar.</p><p class="tip-txt" style="margin-top:8px;">O G do <strong>-ing</strong> nunca é pronunciado: <em>sleepin'</em>, <em>runnin'</em>.</p></div>
    <div class="sub-label">Pratique</div>
    <div class="ex-wrap"><div class="ex-header"><span class="ex-title">Complete com -ing</span><span class="ex-score" id="ing-score">0/10</span></div><div class="ex-body" id="ing-body"></div></div>
  </div>
</div>`,
