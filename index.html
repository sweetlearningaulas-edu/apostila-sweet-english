let cur=0;
function toggleTheme(){
  const d=document.body.classList.contains('dark');
  document.body.classList.toggle('dark',!d);document.body.classList.toggle('light',d);
  localStorage.setItem('hse-theme',d?'light':'dark');
  const btn=document.getElementById('theme-toggle');
  if(btn)btn.className='sp-toggle '+(d?'off':'on');
}
const sv=localStorage.getItem('hse-theme');
if(sv==='light')document.body.classList.replace('dark','light');

let backState=null;
function goAndHighlight(pageIdx, targetId){
  backState={page:cur, scrollTop:document.getElementById('slides').scrollTop};
  go(pageIdx);
  setTimeout(()=>{
    const el=document.getElementById(targetId);
    if(!el)return;
    // remove any previous inline back btn
    const old=document.getElementById('inline-back-btn');
    if(old)old.remove();
    // insert inline back btn right above the target element
    const btn=document.createElement('button');
    btn.id='inline-back-btn';
    btn.innerHTML='← Voltar';
    btn.onclick=goBack;
    el.parentNode.insertBefore(btn,el);
    btn.scrollIntoView({behavior:'smooth',block:'center'});
    el.classList.add('highlight-pulse');
    setTimeout(()=>el.classList.remove('highlight-pulse'),5000);
  },350);
}
function goBack(){
  if(!backState)return;
  const s=backState;backState=null;
  const old=document.getElementById('inline-back-btn');
  if(old)old.remove();
  go(s.page);
  setTimeout(()=>{document.getElementById('slides').scrollTop=s.scrollTop;},350);
}

function go(i){
  if(i<0||i>=pages.length)return;
  cur=i;
  const _accMap={5:'var(--blue)',6:'var(--blue)',7:'var(--green)',8:'var(--green)',
    9:'var(--purple)',10:'var(--purple)',11:'var(--yel)',12:'var(--yel)',
    14:'var(--red)',15:'var(--red)',16:'var(--blue)',17:'var(--blue)',18:'var(--yel)',
    110:'var(--green)',20:'var(--green)',21:'var(--purple)',22:'var(--purple)',
    24:'var(--yel)',25:'var(--yel)',26:'var(--red)',27:'var(--red)',
    28:'var(--blue)',29:'var(--blue)',210:'var(--yel)'};
  if(_accMap[i])document.body.style.setProperty('--acc',_accMap[i]);
  window.speechSynthesis&&window.speechSynthesis.cancel();
  if(chatOpen)closeChat();
  document.getElementById('slides').innerHTML=pages[cur];
  document.getElementById('slides').scrollTop=0;
  if(cur===1){
    const sb=document.getElementById('shimmer-toggle');if(sb)sb.className='sp-toggle '+(document.body.classList.contains('no-shimmer')?'off':'on');
    const tb=document.getElementById('theme-toggle');if(tb)tb.className='sp-toggle '+(document.body.classList.contains('light')?'off':'on');
  }
  if(cur>3){const hd=document.querySelector('.pg-hd');if(hd&&!hd.querySelector('.hd-idx-btn')){const b=document.createElement('button');b.className='hd-idx-btn';b.textContent='← Índice';b.onclick=()=>go(3);hd.appendChild(b);}}
  document.getElementById('ctr').textContent=(cur+1)+' / '+pages.length;
  document.getElementById('prog-fill').style.width=((cur+1)/pages.length*100)+'%';
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===pages.length-1;  if(cur===6)initPronGame();
  if(cur===8)initGame();
  if(cur===10)initEx('ing',window['ing_bk'],10);
  if(cur===12)initEx('tobe',window['tobe_bk'],12);
  if(cur===14)initEx('adj',window['adj_bk'],12);
  if(cur===16)initEx('art',window['art_bk'],12);
  if(cur===17)initEx('rev',window['rev_bk'],15);
  if(cur===20)initEx('pres',window['pres_bk'],10);
  if(cur===22)initEx('past',window['past_bk'],10);
  if(cur===24)initEx('fut',window['fut_bk'],10);
  if(cur===26)initEx('togo',window['togo_bk'],10);
  if(cur===28)initEx('suj',window['suj_bk'],10);
  if(cur===29)initEx('rev2',window['rev2_bk'],15);
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);
});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  const dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>110&&Math.abs(dx)>Math.abs(dy)*2&&!chatOpen)go(dx<0?cur+1:cur-1);
},{passive:true});

  activeTool=null;

let trlDir='pt-en';
function setTrlDir(d){
  trlDir=d;
  document.getElementById('trl-pt-en').classList.toggle('active',d==='pt-en');

  document.getElementById('trl-input').placeholder=d==='pt-en'?'Digite para traduzir...':'Type to translate...';

let trlTimer;

  if(!v){document.getElementById('trl-result').textContent='';return;}
  document.getElementById('trl-result').innerHTML='<span class="tr-loading">Traduzindo...</span>';
  trlTimer=setTimeout(()=>callClaude(trlDir==='pt-en'?'Traduza para inglês americano. Responda APENAS com a tradução, sem explicação, sem aspas:\n'+v:'Translate to Brazilian Portuguese. Reply ONLY with the translation, no explanation, no quotes:\n'+v,res=>{
      const txt=escHtml(res);

  const v=document.getElementById('tts-input').value.trim();if(!v)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(v);u.lang='en-US';u.rate=.45;window.speechSynthesis.speak(u);
}
function toolCorrect(){
  const v=document.getElementById('cor-input').value.trim();if(!v)return;
  const btn=document.getElementById('cor-btn');if(btn)btn.disabled=true;
  document.getElementById('cor-result').innerHTML='<span class="tr-loading">Verificando...</span>';
  callClaude('You are an English teacher. The student wrote: "'+v+'". If correct, reply exactly: OK. Se errado: ❌ <frase correta>\n💡 <explicação em português, máx 15 palavras>',res=>{document.getElementById('cor-result').innerHTML=res.split('\n').join('<br>');if(btn)btn.disabled=false;});
}
function toolExamples(){
  const v=document.getElementById('ex-input').value.trim();if(!v)return;
  const btn=document.getElementById('ex-btn');if(btn)btn.disabled=true;
  document.getElementById('ex-result').innerHTML='<span class="tr-loading">Gerando exemplos...</span>';
  callClaude('Give 3 short natural English sentences using "'+v+'". Everyday Brazilian context. Format: 1. <sentence> — <Portuguese translation>. Reply ONLY with the 3 examples.',res=>{
      const lines=res.split('\n').filter(l=>l.trim());
      const div=document.createElement('div');
      lines.forEach((l,i)=>{
        const enMatch=l.match(/^\d+\.\s*(.+?)\s*—/);
        const enTxt=enMatch?enMatch[1].trim():'';
        const row=document.createElement('div');row.className='tl-result-row';
        const span=document.createElement('span');span.textContent=l;row.appendChild(span);
        if(enTxt){const b=document.createElement('button');b.className='tl-speak-btn';b.textContent='🔊';b.onclick=()=>toolSpeakText(enTxt,b);row.appendChild(b);}
        div.appendChild(row);
      });
      document.getElementById('ex-result').innerHTML='';
      document.getElementById('ex-result').appendChild(div);
      if(btn)btn.disabled=false;
    });
}
let dicCurrent='';
let dicLevel='easy';
function setDicLevel(level,btn){
  dicLevel=level;
  document.querySelectorAll('#dic-level-btns .tl-lvl-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  dicCurrent='';
  const s=document.getElementById('dic-sentence-txt');if(s)s.textContent='Toque em Nova frase para começar';
  const r=document.getElementById('dic-result');if(r)r.textContent='';
  const inp=document.getElementById('dic-input');if(inp)inp.value='';
}
function dicGenerate(){
  const btn=document.getElementById('dic-new-btn');if(btn)btn.disabled=true;
  const s=document.getElementById('dic-sentence-txt');const r=document.getElementById('dic-result');const inp=document.getElementById('dic-input');
  if(s)s.textContent='Gerando frase...';if(r)r.textContent='';if(inp)inp.value='';
  const lvlMap={easy:"Short fun sentence 5-7 words present tense. Subject: Ryan, Ashley, Taylor, Jake, or I/She/He/They. Topic: food, Netflix, music, games. Reply ONLY with the sentence.",medium:"Natural sentence 8-10 words past or present. Topic: iFood, Uber, work, travel, weekend. Vary subjects. Reply ONLY with the sentence.",hard:"Longer sentence 11-14 words mixed tenses everyday situations. Reply ONLY with the sentence."};
  callClaude('Generate ONE random English sentence for dictation practice. Level: '+lvlMap[dicLevel]+'. Use different vocabulary each time. Seed: '+Math.random()+'. Reply ONLY with the sentence, no quotes, no explanation.',res=>{dicCurrent=res.trim();if(s)s.textContent=dicCurrent;
  const icon=document.getElementById('dic-audio-icon');if(icon)icon.textContent='🔊';
  const rb=document.getElementById('dic-repeat-btn');if(rb)rb.disabled=false;
  const sb=document.getElementById('dic-slow-btn');if(sb)sb.disabled=false;
  if(btn)btn.disabled=false;
  const inp=document.getElementById('dic-input');if(inp)inp.value='';
  const r=document.getElementById('dic-result');if(r)r.textContent='';
  dicSpeak();});
}
function dicMainAction(){
  if(!dicCurrent){dicGenerate();}
  else{dicSpeak();}
}
function dicSpeak(){
  if(!window.speechSynthesis||!dicCurrent)return;
  const s=document.getElementById('dic-sentence-txt');if(s)s.textContent='🔊 Ouvindo...';
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(dicCurrent);u.lang='en-US';u.rate=.7;
  u.onend=()=>{const s=document.getElementById('dic-sentence-txt');if(s)s.textContent='Toque na frase ou nos botões abaixo para ouvir de novo';};
  window.speechSynthesis.speak(u);
}
function dicSpeakSlow(){
  if(!window.speechSynthesis||!dicCurrent)return;
  const s=document.getElementById('dic-sentence-txt');if(s)s.textContent='🐢 Ouvindo devagar...';
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(dicCurrent);u.lang='en-US';u.rate=.45;
  u.onend=()=>{const s=document.getElementById('dic-sentence-txt');if(s)s.textContent='Toque na frase ou nos botões abaixo para ouvir de novo';};
  window.speechSynthesis.speak(u);
}
function dicReveal(){
  if(!dicCurrent)return;
  const r=document.getElementById('dic-result');
  if(r)r.innerHTML='<span class="tr-note">Frase: <strong>'+escHtml(dicCurrent)+'</strong></span>';
}
function dicCheck(){
  if(!dicCurrent){const r=document.getElementById('dic-result');if(r)r.innerHTML='<span class="tr-error">Gere uma frase primeiro.</span>';return;}
  const v=(document.getElementById('dic-input').value||'').trim().toLowerCase();
  const correct=dicCurrent.toLowerCase().replace(/[.,!?']/g,'');
  const attempt=v.replace(/[.,!?']/g,'');
  const r=document.getElementById('dic-result');
  if(attempt===correct){r.innerHTML='<span class="tr-correct">Perfeito! ✅</span><br><span class="tr-note">'+escHtml(dicCurrent)+'</span>';}
  else{r.innerHTML='<span class="tr-error">Não exatamente.</span><br><span class="tr-note">Correto: <strong>'+escHtml(dicCurrent)+'</strong></span>';}
}
function toolDict(){
  const v=document.getElementById('dict-input').value.trim();if(!v)return;
  const btn=document.getElementById('dict-btn');if(btn)btn.disabled=true;
  document.getElementById('dict-result').innerHTML='<span class="tr-loading">Buscando...</span>';
  callClaude('Dictionary for Brazilian students. Word: "'+v+'". Reply in 3 lines:\n📌 <word> — <Portuguese meaning>\n📝 <example sentence> — <Portuguese translation>\n🔊 <pronunciation hint in Portuguese phonetics>',res=>{
      const lines=res.split('\n').filter(l=>l.trim());
      const div=document.createElement('div');
      lines.forEach(l=>{
        const enMatch=l.match(/📝\s*(.+?)\s*—/);
        const enTxt=enMatch?enMatch[1].trim():'';
        const row=document.createElement('div');row.className='tl-result-row';
        const span=document.createElement('span');span.textContent=l;row.appendChild(span);
        if(enTxt){const b=document.createElement('button');b.className='tl-speak-btn';b.textContent='🔊';b.onclick=()=>toolSpeakText(enTxt,b);row.appendChild(b);}
        div.appendChild(row);
      });
      document.getElementById('dict-result').innerHTML='';
      document.getElementById('dict-result').appendChild(div);
      if(btn)btn.disabled=false;
    });
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function callClaude(prompt,cb){
  try{
    const r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
    const d=await r.json();
    if(d.error)cb('Erro: '+d.error);
    else cb(d.text||'Erro ao processar.');
  }catch(e){cb('Erro de conexão: '+e.message);}
}

function idxSearch(q){
  const clear=document.getElementById('idx-search-clear');
  if(clear)clear.style.display=q?'block':'none';
  const items=document.querySelectorAll('#idx-list .idx-item');
  const groups=document.querySelectorAll('#idx-list .idx-group');
  const noRes=document.getElementById('idx-no-result');
  const term=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  let anyVisible=false;
  items.forEach(el=>{
    const kw=(el.dataset.kw||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const name=el.querySelector('.idx-name')?.textContent.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')||'';
    const desc=el.querySelector('.idx-desc')?.textContent.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')||'';
    const match=!term||kw.includes(term)||name.includes(term)||desc.includes(term);
    el.toggleAttribute('data-hidden',!match);
    if(match)anyVisible=true;
  });
  groups.forEach(g=>{
    let sib=g.nextElementSibling;let hasVisible=false;
    while(sib&&!sib.classList.contains('idx-group')){if(!sib.hasAttribute('data-hidden'))hasVisible=true;sib=sib.nextElementSibling;}
    g.toggleAttribute('data-hidden',!hasVisible);
  });
  if(noRes)noRes.style.display=anyVisible||!term?'none':'block';
}
function idxClear(){
  const inp=document.getElementById('idx-search');
  if(inp){inp.value='';inp.focus();}
  idxSearch('');
}

go(0);
