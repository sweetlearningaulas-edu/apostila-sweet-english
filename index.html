`<div class="page pg-content" style="--acc:#f6ad55;">
  <div class="pg-hd"><div class="pg-lbl">Seção 04 · Verbo To Be</div><div class="pg-ttl">Ser e Estar</div></div>
  <div class="pg-body">
    <p class="intro">O verbo <span class="en" data-speak="to be">to be</span> em português é o verbo <strong>ser</strong> e o verbo <strong>estar</strong>.</p>

    <!-- ════ PRESENTE ════ -->
    <div class="tobe-divider"><div class="tobe-divider-line"></div><div class="tobe-divider-label">Presente</div><div class="tobe-divider-line"></div></div>

    <div class="tobe-card" id="tobe-presente">
      <div class="tobe-card-hd">Presente — Afirmativo</div>
      <div class="tobe-card-body">
        <div class="conj-big">
          <div class="conj-big-row">
            <div class="conj-big-top">
              <span class="conj-verb-main"><span class="en" data-speak="am">am</span></span>
              <span class="conj-verb-abbr">/ 'm</span>
            </div>
            <div class="conj-tr-big">sou / estou</div>
            <div class="conj-who-big">I</div>
          </div>
          <div class="conj-big-row">
            <div class="conj-big-top">
              <span class="conj-verb-main"><span class="en" data-speak="is">is</span></span>
              <span class="conj-verb-abbr">/ 's</span>
            </div>
            <div class="conj-tr-big">é / está</div>
            <div class="conj-who-big">He, She, It</div>
          </div>
          <div class="conj-big-row">
            <div class="conj-big-top">
              <span class="conj-verb-main"><span class="en" data-speak="are">are</span></span>
              <span class="conj-verb-abbr">/ 're</span>
            </div>
            <div class="conj-tr-big">são / estão / somos / estamos</div>
            <div class="conj-who-big">You, We, They</div>
          </div>
        </div>
        <div class="quote-list">
          <div class="quote">
            <div class="q-pt">Eu estou feliz.</div>
            <div class="q-en"><span class="en" data-speak="I am happy">I am happy.</span></div>
            <div class="q-en"><span class="en" data-speak="I'm happy">I'm happy.</span></div>
          </div>
          <div class="quote">
            <div class="q-pt">Ela está brincando.</div>
            <div class="q-en"><span class="en" data-speak="She is playing">She is playing.</span></div>
            <div class="q-en"><span class="en" data-speak="She's playing">She's playing.</span></div>
          </div>
          <div class="quote">
            <div class="q-pt">Eles são amigos.</div>
            <div class="q-en"><span class="en" data-speak="They are friends">They are friends.</span></div>
            <div class="q-en"><span class="en" data-speak="They're friends">They're friends.</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tobe-card">
      <div class="tobe-card-hd red">Presente — Negativo</div>
      <div class="tobe-card-body">
        <div class="conj-big">
          <div class="conj-big-row">
            <div class="conj-big-top">
              <span class="conj-verb-main"><span class="en" data-speak="ain't">ain't</span></span>
              <span style="font-size:12px;color:var(--m)">/ am not</span>
            </div>
            <div class="conj-tr-big">não sou / não estou</div>
            <div class="conj-who-big">I</div>
          </div>
          <div class="conj-big-row">
            <div class="conj-big-top">
              <span class="conj-verb-main"><span class="en" data-speak="isn't">isn't</span></span>
              <span style="font-size:12px;color:var(--m)">/ is not</span>
            </div>
            <div class="conj-tr-big">não é / não está</div>
            <div class="conj-who-big">He, She, It</div>
          </div>
          <div class="conj-big-row">
            <div class="conj-big-top">
              <span class="conj-verb-main"><span class="en" data-speak="aren't">aren't</span></span>
              <span style="font-size:12px;color:var(--m)">/ are not</span>
            </div>
            <div class="conj-tr-big">não são / não estão / não somos / não estamos</div>
            <div class="conj-who-big">You, We, They</div>
          </div>
        </div>
        <div class="quote-list">
          <div class="quote">
            <div class="q-pt">Eu não estou feliz.</div>
            <div class="q-en"><span class="en" data-speak="I am not happy">I am not happy.</span></div>
            <div class="q-en"><span class="en" data-speak="I ain't happy">I ain't happy.</span></div>
          </div>
          <div class="quote">
            <div class="q-pt">Ela não está brincando.</div>
            <div class="q-en"><span class="en" data-speak="She is not playing">She is not playing.</span></div>
            <div class="q-en"><span class="en" data-speak="She isn't playing">She isn't playing.</span></div>
          </div>
          <div class="quote">
            <div class="q-pt">Eles não são amigos.</div>
            <div class="q-en"><span class="en" data-speak="They are not friends">They are not friends.</span></div>
            <div class="q-en"><span class="en" data-speak="They aren't friends">They aren't friends.</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tobe-card">
      <div class="tobe-card-hd" style="background:#2a6a55;">Abreviações Afirmativas — 'm / 's / 're</div>
      <div class="tobe-card-body">
        <p class="intro">As abreviações <strong>'m</strong>, <strong>'s</strong>, <strong>'re</strong> são usadas em conversas e redes sociais. Na escrita formal, use a forma completa (am, is, are).</p>
        <div class="quote-list">
          <div class="quote">
            <div class="q-pt">Ela está brincando.</div>
            <div class="q-en"><span class="en" data-speak="She is playing">She is playing.</span> <span class="q-tr">escrita formal</span></div>
            <div class="q-en"><span class="en" data-speak="She's playing">She's playing.</span> <span class="q-tr">escrita informal</span></div>
          </div>
        </div>
        <div class="tip"><div class="tip-lbl">📝 Só na escrita</div><p class="tip-txt">Essas regras são relevantes só na escrita — na fala, pronunciamos da mesma forma.</p></div>
      </div>
    </div>

    <div class="tobe-card">
      <div class="tobe-card-hd red" style="background:#8a2a44;">Abreviações Negativas — isn't / aren't</div>
      <div class="tobe-card-body">
        <p class="intro">As abreviações negativas <strong>isn't</strong> e <strong>aren't</strong>, ao contrário das afirmativas, são as formas mais comuns de se falar e de se escrever. Quando não abreviamos uma negação em inglês, estamos dando ênfase.</p>
        <div class="quote-list">
          <div class="quote">
            <div class="q-pt">Ela não está brincando.</div>
            <div class="q-en"><span class="en" data-speak="She isn't playing">She isn't playing.</span> <span class="q-tr">normal, do cotidiano</span></div>
            <div class="q-en"><span class="en" data-speak="She is not playing">She is not playing.</span> <span class="q-tr">enfático, ríspido</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tobe-card" id="you-singular-plural-pres">
      <div class="tobe-card-hd" style="background:#5a3a8a;">You — Singular e Plural</div>
      <div class="tobe-card-body">
        <p class="intro">Como já vimos em <span class="tb-link" onclick="goAndHighlight(6,'you-plural-section')">Pronomes Pessoais</span>, o <strong>you</strong> é singular e plural ao mesmo tempo. Por isso, no verbo to be, o <strong>you</strong> sempre será conjugado no plural — mesmo que esteja fazendo papel de "você" (singular).</p>
        <div class="quote-list">
          <div class="quote">
            <div class="q-pt">Você é legal. <span class="q-tr">(singular)</span></div>
            <div class="q-en" style="color:var(--red);text-decoration:line-through;font-size:13px;">You is nice. ❌</div>
            <div class="q-en"><span class="en" data-speak="You are nice">You are nice. ✓</span></div>
          </div>
          <div class="quote">
            <div class="q-pt">Você não é legal.</div>
            <div class="q-en" style="color:var(--red);text-decoration:line-through;font-size:13px;">You isn't nice. ❌</div>
            <div class="q-en"><span class="en" data-speak="You aren't nice">You aren't nice. ✓</span></div>
          </div>
        </div>
        <p class="intro" style="margin-top:4px;">O problema é que, no plural, a frase fica igualzinha. Para deixar claro que é plural, adicionamos as terminações já vistas em <span class="tb-link" onclick="goAndHighlight(6,'you-plural-section')">Pronomes Pessoais</span>.</p>
        <div class="quote-list">
          <div class="quote">
            <div class="q-pt">Vocês são legais.</div>
            <div class="q-en"><span class="en" data-speak="You are nice">You are nice.</span> <span class="q-tr">igual ao singular!</span></div>
          </div>
          <div class="quote">
            <div class="q-pt">Vocês dois são legais.</div>
            <div class="q-en"><span class="en" data-speak="You two are nice">You two are nice.</span> <span class="q-tr">agora fica claro</span></div>
          </div>
          <div class="quote">
            <div class="q-pt">Vocês dois não são legais.</div>
            <div class="q-en"><span class="en" data-speak="You two aren't nice">You two aren't nice.</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tobe-card">
      <div class="tobe-card-hd" style="background:#6a4a10;">Ain't — Am Not</div>
      <div class="tobe-card-body">
        <p class="intro">Apesar de, em negações, não usar a forma abreviada dar ênfase, o <strong>ain't</strong> foge um pouco desta regra. Ele é considerado mal visto — quase como usar "num tô" em vez de "não estou". Por isso, o mais comum será o <strong>am not</strong>. Relaxe, você não vai soar enfático.</p>
      </div>
    </div>

    <!-- ════ PRESENTE INTERROGATIVO ════ -->
    <div class="tobe-divider"><div class="tobe-divider-line"></div><div class="tobe-divider-label" id="tobe-interrogativo-pres">Presente — Interrogativo</div><div class="tobe-divider-line"></div></div>

    <div class="tobe-card">
      <div class="tobe-card-hd grn">Presente — Interrogativo</div>
      <div class="tobe-card-body">
        <p class="intro">Em inglês, quando formos fazer uma pergunta, devemos <strong>inverter o verbo auxiliar com o sujeito</strong>. O verbo to be inteiro é um verbo auxiliar.</p>
        <div class="quote-list">
          <div class="quote">
            <div class="q-pt">Ela está dormindo? <span class="q-tr">(está = to be = verbo auxiliar)</span></div>
            <div class="q-en" style="color:var(--m);font-size:13px;font-style:italic;">→ Está ela dormindo?</div>
            <div class="q-en"><span class="en" data-speak="Is she sleeping?">Is she sleeping?</span></div>
          </div>
          <div class="quote">
            <div class="q-pt">Ela não está dormindo? <span class="q-tr">(não está = to be = verbo auxiliar)</span></div>
            <div class="q-en" style="color:var(--m);font-size:13px;font-style:italic;">→ Não está ela dormindo?</div>
            <div class="q-en"><span class="en" data-speak="Isn't she sleeping?">Isn't she sleeping?</span> <span class="q-tr">normal, do cotidiano</span></div>
            <div class="q-en"><span class="en" data-speak="Is she not sleeping?">Is she not sleeping?</span> <span class="q-tr">enfático, ríspido</span></div>
          </div>
        </div>
        <div class="irony-block">
          <div class="irony-label">⚠️ Sem inversão = sarcasmo</div>
          <p class="irony-txt">Se <strong>não fizermos a inversão</strong> e traduzirmos ao pé da letra, a pergunta vira <strong>irônica, retórica ou sarcástica</strong> — como se a resposta fosse óbvia.</p>
          <div style="margin-top:10px;display:flex;flex-direction:column;gap:7px;">
            <div class="quote" style="border-left-color:var(--yel)">
              <div class="q-en"><span class="en" data-speak="She is sleeping?">She is sleeping?</span></div>
              <div class="q-tr">sendo que claramente ela está dormindo</div>
            </div>
            <div class="quote" style="border-left-color:var(--yel)">
              <div class="q-en"><span class="en" data-speak="She isn't working?">She isn't working?</span></div>
              <div class="q-tr">sendo que claramente ela está trabalhando</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ════ PASSADO ════ -->
    <div class="tobe-divider"><div class="tobe-divider-line"></div><div class="tobe-divider-label">Passado</div><div class="tobe-divider-line"></div></div>

    <div class="tobe-card" id="tobe-passado">
      <div class="tobe-card-hd pur">Passado — Afirmativo</div>
      <div class="tobe-card-body">
        <div class="conj-big">
          <div class="conj-big-row">
            <div class="conj-big-top">
              <span class="conj-verb-main"><span class="en" data-speak="was">was</span></span>
            </div>
            <div class="conj-tr-big">era / estava</div>
            <div class="conj-who-big">I, He, She, It</div>
          </div>
          <div class="conj-big-row">
            <div class="conj-big-top">
              <span class="conj-verb-main"><span class="en" data-speak="were">were</span></span>
            </div>
            <div class="conj-tr-big">eram / estavam / éramos / estávamos</div>
            <div class="conj-who-big">You, We, They</div>
          </div>
        </div>
        <div class="quote-list">
          <div class="quote">
            <div class="q-pt">Ela estava brincando.</div>
            <div class="q-en"><span class="en" data-speak="She was playing">She was playing.</span></div>
          </div>
          <div class="quote">
            <div class="q-pt">Eles eram amigos.</div>
            <div class="q-en"><span class="en" data-speak="They were friends">They were friends.</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tobe-card">
      <div class="tobe-card-hd red">Passado — Negativo</div>
      <div class="tobe-card-body">
        <div class="conj-big">
          <div class="conj-big-row">
            <div class="conj-big-top">
              <span class="conj-verb-main"><span class="en" data-speak="wasn't">wasn't</span></span>
              <span style="font-size:12px;color:var(--m)">/ was not</span>
            </div>
            <div class="conj-tr-big">não era / não estava</div>
            <div class="conj-who-big">I, He, She, It</div>
          </div>
          <div class="conj-big-row">
            <div class="conj-big-top">
              <span class="conj-verb-main"><span class="en" data-speak="weren't">weren't</span></span>
              <span style="font-size:12px;color:var(--m)">/ were not</span>
            </div>
            <div class="conj-tr-big">não eram / não estavam / não éramos / não estávamos</div>
            <div class="conj-who-big">You, We, They</div>
          </div>
        </div>
        <div class="quote-list">
          <div class="quote">
            <div class="q-pt">Ela não estava brincando.</div>
            <div class="q-en"><span class="en" data-speak="She wasn't playing">She wasn't playing.</span> <span class="q-tr">normal, do cotidiano</span></div>
            <div class="q-en"><span class="en" data-speak="She was not playing">She was not playing.</span> <span class="q-tr">enfático, ríspido</span></div>
          </div>
        </div>
        <p class="intro">Assim como no presente, não usar a abreviação <strong>enfatiza a negação</strong>.</p>
      </div>
    </div>

    <div class="tobe-card" id="you-singular-plural-past">
      <div class="tobe-card-hd" style="background:#5a3a8a;">You — Singular e Plural no Passado</div>
      <div class="tobe-card-body">
        <p class="intro">Assim como no presente, o <strong>you</strong> sempre usa <strong>were</strong> — mesmo no singular. E quando precisar deixar claro que é plural, adicione as terminações já vistas em <span class="tb-link" onclick="goAndHighlight(6,'you-plural-section')">Pronomes Pessoais</span>.</p>
        <div class="quote-list">
          <div class="quote">
            <div class="q-pt">Você era legal. <span class="q-tr">(singular)</span></div>
            <div class="q-en" style="color:var(--red);text-decoration:line-through;font-size:13px;">You was nice. ❌</div>
            <div class="q-en"><span class="en" data-speak="You were nice">You were nice. ✓</span></div>
          </div>
          <div class="quote">
            <div class="q-pt">Vocês dois eram legais. <span class="q-tr">(plural claro)</span></div>
            <div class="q-en"><span class="en" data-speak="You two were nice">You two were nice.</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ════ PASSADO INTERROGATIVO ════ -->
    <div class="tobe-divider"><div class="tobe-divider-line"></div><div class="tobe-divider-label" id="tobe-interrogativo-past">Passado — Interrogativo</div><div class="tobe-divider-line"></div></div>

    <div class="tobe-card">
      <div class="tobe-card-hd grn">Passado — Interrogativo</div>
      <div class="tobe-card-body">
        <p class="intro">A regra de perguntas funciona igual à do presente: <strong>invertemos o verbo auxiliar com o sujeito</strong>. Sem a inversão, a pergunta vira irônica, sarcástica ou retórica.</p>
        <div class="quote-list">
          <div class="quote">
            <div class="q-pt">Ela estava dormindo? <span class="q-tr">(estava = to be = verbo auxiliar)</span></div>
            <div class="q-en" style="color:var(--m);font-size:13px;font-style:italic;">→ Estava ela dormindo?</div>
            <div class="q-en"><span class="en" data-speak="Was she sleeping?">Was she sleeping?</span></div>
          </div>
          <div class="quote">
            <div class="q-pt">Ela não estava dormindo?</div>
            <div class="q-en" style="color:var(--m);font-size:13px;font-style:italic;">→ Não estava ela dormindo?</div>
            <div class="q-en"><span class="en" data-speak="Wasn't she sleeping?">Wasn't she sleeping?</span> <span class="q-tr">normal, do cotidiano</span></div>
            <div class="q-en"><span class="en" data-speak="Was she not sleeping?">Was she not sleeping?</span> <span class="q-tr">enfático, ríspido</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ════ FUTURO ════ -->
    <div class="tobe-divider"><div class="tobe-divider-line"></div><div class="tobe-divider-label">Futuro</div><div class="tobe-divider-line"></div></div>

    <div class="tobe-card" id="tobe-futuro">
      <div class="tobe-card-hd yel">Futuro — Afirmativo</div>
      <div class="tobe-card-body">
        <p class="intro">Em inglês não existe conjugação direta para o futuro. Usamos <span class="en" data-speak="will be">will be</span> para todo mundo.</p>
        <div class="conj-big">
          <div class="conj-big-row">
            <div class="conj-big-top">
              <span class="conj-verb-main"><span class="en" data-speak="will">will</span></span>
              <span class="conj-verb-abbr">/ 'll</span>
            </div>
            <div class="conj-tr-big">vou, vai, vamos, vão</div>
          </div>
          <div class="conj-big-row">
            <div class="conj-big-top">
              <span class="conj-verb-main"><span class="en" data-speak="be">be</span></span>
            </div>
            <div class="conj-tr-big">ser, estar</div>
          </div>
        </div>
        <div class="quote-list">
          <div class="quote">
            <div class="q-pt">Ela vai estar brincando.</div>
            <div class="q-en"><span class="en" data-speak="She will be playing">She will be playing.</span> <span class="q-tr">escrita formal</span></div>
            <div class="q-en"><span class="en" data-speak="She'll be playing">She'll be playing.</span> <span class="q-tr">escrita informal</span></div>
          </div>
        </div>
        <div class="tip"><div class="tip-lbl">📝 Só na escrita</div><p class="tip-txt">A abreviação <strong>'ll</strong> é relevante só na escrita — na fala, pronunciamos da mesma forma.</p></div>
      </div>
    </div>

    <div class="tobe-card">
      <div class="tobe-card-hd red">Futuro — Negativo</div>
      <div class="tobe-card-body">
        <div class="conj-big">
          <div class="conj-big-row">
            <div class="conj-big-top">
              <span class="conj-verb-main"><span class="en" data-speak="won't">won't</span></span>

            </div>
            <div class="conj-tr-big">não vou, não vai, não vamos, não vão</div>
          </div>
          <div class="conj-big-row">
            <div class="conj-big-top">
              <span class="conj-verb-main"><span class="en" data-speak="be">be</span></span>
            </div>
            <div class="conj-tr-big">ser, estar</div>
          </div>
        </div>
        <div class="quote-list">
          <div class="quote">
            <div class="q-pt">Ela não vai estar brincando.</div>
            <div class="q-en"><span class="en" data-speak="She won't be playing">She won't be playing.</span> <span class="q-tr">normal, do cotidiano</span></div>
            <div class="q-en"><span class="en" data-speak="She will not be playing">She will not be playing.</span> <span class="q-tr">enfático, ríspido</span></div>

      </div>
    </div>

    <!-- ════ FUTURO INTERROGATIVO ════ -->
    <div class="tobe-divider"><div class="tobe-divider-line"></div><div class="tobe-divider-label" id="tobe-interrogativo-fut">Futuro — Interrogativo</div><div class="tobe-divider-line"></div></div>

    <div class="tobe-card">
      <div class="tobe-card-hd grn">Futuro — Interrogativo</div>
      <div class="tobe-card-body">
        <p class="intro">A regra de perguntas se mantém igual: <strong>invertemos o verbo auxiliar com o sujeito</strong>. No futuro, os verbos auxiliares são o <strong>will</strong> e o <strong>won't</strong>. Sem a inversão, a pergunta vira irônica, sarcástica ou retórica.</p>
        <div class="quote-list">
          <div class="quote">
            <div class="q-pt">Ela vai estar dormindo? <span class="q-tr">(vai = will = verbo auxiliar)</span></div>

            <td><span class="abbr">will be</span><span class="tr">vão ser/estar</span></td>

    <div class="tip grn"><div class="tip-lbl">💡 I am</div><p class="tip-txt">Só o <strong>I</strong> usa <strong>am</strong>. Nenhum outro pronome.</p></div>
    <div class="tip grn"><div class="tip-lbl">💡 Was e Were</div><p class="tip-txt">Quem usa <strong>is</strong> usa <strong>was</strong>. Quem usa <strong>are</strong> usa <strong>were</strong>.<br><span class="en" data-speak="is">is</span> → <span class="en" data-speak="was">was</span> &nbsp;·&nbsp; <span class="en" data-speak="are">are</span> → <span class="en" data-speak="were">were</span></p></div>

`<div class="page pg-content" style="--acc:#fc8181;">
  <div class="pg-hd"><div class="pg-lbl">Seção 05 · Adjetivos</div><div class="pg-ttl">Como descrever as coisas</div></div>
  <div class="pg-body">
    <p class="intro" id="adj-intro">Um <strong>adjetivo</strong> é uma palavra que descreve a característica de algo ou alguém.</p>
    <div class="quote-list">
      <div class="quote"><div class="q-pt">Eu comprei uma caneta <b>azul</b>.</div></div>
      <div class="quote"><div class="q-pt">A camiseta <b>amarela</b> está suja.</div></div>
      <div class="quote"><div class="q-pt">Meu pai comprou um computador <b>potente e rápido</b>.</div></div>
    </div>
    <div class="tip red" id="adj-ordem"><div class="tip-lbl">⚠️ Regra principal</div><p class="tip-txt">Em português o adjetivo vem <strong>depois</strong> do substantivo. Em inglês, vem <strong>sempre antes</strong>.</p></div>
    <div class="sub-label">Exemplos</div>
    <div class="quote-list">
      <div class="quote"><div class="q-pt">Eu comprei uma caneta azul.</div><div class="q-en">I bought a <span class="en" data-speak="blue pen">blue pen</span>.</div></div>
      <div class="quote"><div class="q-pt">Meu pai comprou um computador potente e rápido.</div><div class="q-en">My dad bought a <span class="en" data-speak="powerful and fast computer">powerful and fast computer</span>.</div></div>
      <div class="quote"><div class="q-pt">A amiga dela tem uma casa grande e bonita.</div><div class="q-en">Her friend has a <span class="en" data-speak="big and beautiful house">big and beautiful house</span>.</div></div>
      <div class="quote"><div class="q-pt">Douglas conheceu uma menina legal.</div><div class="q-en">Douglas met a <span class="en" data-speak="cool girl">cool girl</span>.</div></div>
    </div>
    <div class="tip grn"><div class="tip-lbl" id="adj-plural">💡 Adjetivos não têm plural</div><p class="tip-txt">Em português: carro <strong>vermelho</strong>, carros <strong>vermelhos</strong>. Em inglês o adjetivo nunca muda.<br><br>The <span class="en" data-speak="yellow t-shirts">yellow</span> t-shirts are dirty. ✅<br>The yellows t-shirts are dirty. ❌</p></div>
    <div class="sub-label" id="adj-tobe">Adjetivo após o verbo to be</div>
    <p class="intro">Quando o adjetivo vem depois do verbo to be, a ordem é a mesma do português.</p>
    <div class="quote-list">
      <div class="quote"><div class="q-pt">A camiseta é amarela.</div><div class="q-en">The t-shirt <span class="en" data-speak="is yellow">is yellow</span>.</div></div>
      <div class="quote"><div class="q-pt">O carro estava quebrado.</div><div class="q-en">The car <span class="en" data-speak="was broken">was broken</span>.</div></div>
      <div class="quote"><div class="q-pt">Aqueles meninos são legais.</div><div class="q-en">Those boys <span class="en" data-speak="are cool">are cool</span>.</div></div>
      <div class="quote"><div class="q-pt">O casal será feliz.</div><div class="q-en">The couple <span class="en" data-speak="will be happy">will be happy</span>.</div></div>
    </div>
    <div class="sub-label" id="adj-de">Quando o "de" some em inglês</div>
    <p class="intro">Em português, usamos "de" para ligar um substantivo a uma característica: <strong>janela de vidro</strong>, <strong>camiseta de algodão</strong>. Em inglês, o "de" não existe — o adjetivo simplesmente fica antes, sem nada entre eles.</p>
    <div class="quote-list">
      <div class="quote"><div class="q-pt">janela de vidro</div><div class="q-en"><span class="en" data-speak="glass window">glass window</span></div></div>
      <div class="quote"><div class="q-pt">camiseta de algodão</div><div class="q-en"><span class="en" data-speak="cotton t-shirt">cotton t-shirt</span></div></div>
      <div class="quote"><div class="q-pt">porta de madeira</div><div class="q-en"><span class="en" data-speak="wooden door">wooden door</span></div></div>
      <div class="quote"><div class="q-pt">garrafa de plástico</div><div class="q-en"><span class="en" data-speak="plastic bottle">plastic bottle</span></div></div>
      <div class="quote"><div class="q-pt">sapato de couro</div><div class="q-en"><span class="en" data-speak="leather shoe">leather shoe</span></div></div>
    </div>
    <div class="tip"><div class="tip-lbl">💡 Sem "de", sem "of"</div><p class="tip-txt">Não existe tradução para o "de" nesses casos. O adjetivo simplesmente vai antes do substantivo, sem nenhuma palavra de conexão.</p></div>

    <div class="sub-label">Pratique</div>
    <div class="ex-wrap"><div class="ex-header"><span class="ex-title">Complete a frase</span><span class="ex-score" id="adj-score">0/12</span></div><div class="ex-body" id="adj-body"></div></div>
  </div>
</div>`,

`<div class="page pg-content" style="--acc:#4fd1c5;">
  <div class="pg-hd"><div class="pg-lbl">Seção 06 · Artigos</div><div class="pg-ttl">The, A, An e Some</div></div>
  <div class="pg-body">
    <div class="sub-label" id="art-the">Artigo Definido — The</div>
    <p class="intro"><span class="en" data-speak="the">The</span> equivale ao <strong>o, a, os, as</strong>. Usado quando ambos sabem do que se fala, ou quando o objeto já foi mencionado.</p>
    <div class="quote-list">
      <div class="quote"><div class="q-pt">O menino estava dormindo.</div><div class="q-en"><span class="en" data-speak="The boy was sleeping">The boy was sleeping</span>.</div></div>
      <div class="quote"><div class="q-pt">Os meninos estavam dormindo.</div><div class="q-en"><span class="en" data-speak="The boys were sleeping">The boys were sleeping</span>.</div></div>
    </div>
    <div class="tip" id="pron-nomes" red"><div class="tip-lbl">⚠️ Nomes próprios de pessoas</div><p class="tip-txt">Em inglês <strong>não se usa artigo antes de nomes de pessoas</strong>.<br><br>Jaden was playing. ✅ &nbsp; <s>The Jaden was playing.</s> ❌</p></div>
    <div class="tip yel"><div class="tip-lbl">⚠️ Exceções — nomes próprios que usam "the"</div><p class="tip-txt">
      <strong>Países compostos ou no plural:</strong><br>
      <span class="en" data-speak="The United States">The United States</span> · <span class="en" data-speak="The United Kingdom">The United Kingdom</span> · <span class="en" data-speak="The Netherlands">The Netherlands</span><br><br>
      <strong>Rios, oceanos e mares:</strong><br>
      <span class="en" data-speak="The Amazon">The Amazon</span> · <span class="en" data-speak="The Nile">The Nile</span> · <span class="en" data-speak="The Pacific">The Pacific</span> · <span class="en" data-speak="The Mediterranean">The Mediterranean</span><br><br>
      <strong>Cadeias de montanhas e desertos:</strong><br>
      <span class="en" data-speak="The Alps">The Alps</span> · <span class="en" data-speak="The Himalayas">The Himalayas</span> · <span class="en" data-speak="The Sahara">The Sahara</span><br><br>
      <strong>Bandas e grupos:</strong><br>
      <span class="en" data-speak="The Beatles">The Beatles</span> · <span class="en" data-speak="The Rolling Stones">The Rolling Stones</span><br><br>
      <strong>Jornais:</strong><br>
      <span class="en" data-speak="The New York Times">The New York Times</span> · <span class="en" data-speak="The Guardian">The Guardian</span>
    </p></div>
    <div class="sub-label">Artigo Indefinido — A / An</div>
    <div id="art-a-an" style="scroll-margin-top:20px;"><p class="intro" style="margin:0 0 8px;"><span class="en" data-speak="a">A</span> e <span class="en" data-speak="an">An</span> equivalem ao <strong>um, uma</strong>. Use quando fala de algo pela primeira vez ou de qualquer objeto do tipo.</p>
    <div class="tip"><div class="tip-lbl">📌 A vs An</div><p class="tip-txt">Use <strong>a</strong> antes de som de <strong>consoante</strong>. Use <strong>an</strong> antes de som de <strong>vogal</strong>. O que importa é o <strong>som</strong>, não a letra.</p></div>
    <div class="quote-list">
      <div class="quote"><div class="q-pt">Ele vai comprar um carro.</div><div class="q-en">He will buy <span class="en" data-speak="a car">a car</span>.</div></div>
      <div class="quote"><div class="q-pt">Eu vou comprar um carro laranja.</div><div class="q-en">I will buy <span class="en" data-speak="an orange car">an orange car</span>. <span class="q-tr">(começa com vogal)</span></div></div>
      <div class="quote"><div class="q-pt">Uma maçã.</div><div class="q-en"><span class="en" data-speak="An apple">An apple</span>.</div></div>

`<div class="page pg-content" style="--acc:#f6ad55;">

  <div class="pg-body">

    <p class="intro" id="queexp-intro">Em inglês, utilizamos o pronome relativo <strong>"que"</strong> de três formas diferentes.</p>

    <div class="que-summary" id="queexp-resumo">
      <div class="que-card que-card-that">
        <div class="que-card-en"><span class="en" data-speak="that">That</span></div>
        <div class="que-card-label">Coringa</div>
        <div class="que-card-desc">Funciona para pessoas e coisas</div>
      </div>
      <div class="que-card que-card-who">
        <div class="que-card-en"><span class="en" data-speak="who">Who</span></div>
        <div class="que-card-label">Seres humanos</div>
        <div class="que-card-desc">Usado exclusivamente para pessoas</div>
      </div>
      <div class="que-card que-card-which">
        <div class="que-card-en"><span class="en" data-speak="which">Which</span></div>
        <div class="que-card-label">Não-humanos</div>
        <div class="que-card-desc">Animais, objetos e coisas em geral</div>
      </div>
    </div>

    <div class="que-ex-block" id="queexp-who">
      <div class="que-ex-pt">O <span class="que-subj">menino</span> <span class="que-rel">que</span> estava dormindo é meu amigo.</div>
      <div class="que-ex-en"><span class="en" data-speak="The boy that was sleeping is my friend.">The <span class="que-subj">boy</span> <span class="que-that">that</span> was sleeping is my friend.</span></div>
      <div class="que-ex-en"><span class="en" data-speak="The boy who was sleeping is my friend.">The <span class="que-subj">boy</span> <span class="que-who">who</span> was sleeping is my friend.</span></div>
    </div>

    <div class="que-ex-block" id="queexp-which">
      <div class="que-ex-pt">O <span class="que-subj-obj">computador</span> <span class="que-rel">que</span> estava quebrado é meu.</div>
      <div class="que-ex-en"><span class="en" data-speak="The computer that was broken is mine.">The <span class="que-subj-obj">computer</span> <span class="que-that">that</span> was broken is mine.</span></div>
      <div class="que-ex-en"><span class="en" data-speak="The computer which was broken is mine.">The <span class="que-subj-obj">computer</span> <span class="que-which">which</span> was broken is mine.</span></div>

    <div class="tip" id="queexp-that">
      <div class="tip-lbl">💡 That é o coringa</div>
      <p class="tip-txt"><span class="en" data-speak="that">That</span> funciona para <strong>qualquer coisa</strong> — pessoas, animais e objetos. Em inglês informal, é o mais usado.</p>

    <div class="tip" id="queexp-who-tip">
      <div class="tip-lbl">👤 Who é só para pessoas</div>
      <p class="tip-txt"><span class="en" data-speak="who">Who</span> é usado <strong>exclusivamente para seres humanos</strong>. Nunca use who para animais ou objetos.</p>
    </div>

    <div class="tip yel">
      <div class="tip-lbl">⚠️ Which nunca para pessoas</div>
      <p class="tip-txt"><span class="en" data-speak="which">Which</span> é usado apenas para <strong>coisas e animais</strong>, nunca para pessoas. É mais comum no inglês escrito e formal.</p>
    </div>

  </div>
  <div class="ex-wrap"><div class="ex-header"><span class="ex-title">Que (explicativo) — exercício</span><span class="ex-score" id="queexp-score">0/10</span></div><div class="ex-body" id="queexp-body"></div></div>
</div>`,

`<div class="page pg-content" style="--acc:#ffd580;">
  <div class="pg-hd"><div class="pg-lbl">Seção 16 · Pronomes de Posse</div><div class="pg-ttl">Pronomes de Posse</div></div>
  <div class="pg-body">

    <p class="intro" id="poss-intro">Um <strong>pronome de posse</strong>, ou pronome possessivo, serve para indicar de quem é a posse.</p>

    <div class="quote-list">
      <div class="quote"><div class="q-pt"><span class="poss-hl-adj">Meu</span> carro é bem bonito.</div></div>
      <div class="quote"><div class="q-pt">Ontem nós estávamos na casa <span class="poss-hl-pp">dela</span>.</div></div>
      <div class="quote"><div class="q-pt">João sempre compra os <span class="poss-hl-adj">nossos</span> produtos.</div></div>
    </div>

    <p class="intro" style="margin-top:8px;">Em inglês nós temos dois tipos de pronomes de posse: <span class="poss-hl-adj"><strong>pronomes possessivos adjetivos (PPA)</strong></span> e <span class="poss-hl-pp"><strong>pronomes possessivos (PP)</strong></span>.</p>


    <div class="poss-triple-table" id="poss-tabela">
      <div class="poss-triple-row hd">
        <span>Português</span>
        <span class="poss-hl-adj">PPA</span>
        <span class="poss-hl-pp">PP</span>
      </div>
      <div class="poss-triple-row"><span>Meu(s), Minha(s)</span><span class="en ppa" data-speak="my">My</span><span class="en pp" data-speak="mine">Mine</span></div>
      <div class="poss-triple-row"><span>Seu(s), Sua(s)</span><span class="en ppa" data-speak="your">Your</span><span class="en pp" data-speak="yours">Yours</span></div>
      <div class="poss-triple-row"><span>Dele</span><span class="en ppa" data-speak="his">His</span><span class="en pp" data-speak="his">His</span></div>
      <div class="poss-triple-row"><span>Dela</span><span class="en ppa" data-speak="her">Her</span><span class="en pp" data-speak="hers">Hers</span></div>
      <div class="poss-triple-row"><span>Dele/Dela (sem gênero)</span><span class="en ppa" data-speak="its">Its</span><span class="en pp" data-speak="its">Its</span></div>
      <div class="poss-triple-row"><span>Nosso(s), Nossa(s)</span><span class="en ppa" data-speak="our">Our</span><span class="en pp" data-speak="ours">Ours</span></div>
      <div class="poss-triple-row"><span>Deles, Delas</span><span class="en ppa" data-speak="their">Their</span><span class="en pp" data-speak="theirs">Theirs</span></div>
    </div>

    <div class="rule-box" id="poss-regra">
      <p style="font-size:13px;color:var(--s);line-height:1.8;">Todo pronome de posse deverá aparecer <strong>antes da posse</strong>, utilizando <span class="poss-hl-adj"><strong>PPA</strong></span>.<br>
      A menos que esteja logo após um <strong>verbo to be</strong>, utilizando <span class="poss-hl-pp"><strong>PP</strong></span>.<br>
      Além disso, <strong>não usamos "the"</strong> antes de pronomes de posse.</p>
    </div>

    <div class="poss-legend">
      <span class="poss-legend-item adj">Pronome de posse</span>
      <span class="poss-legend-item noun">A posse</span>
      <span class="poss-legend-item tobe">Verbo to be</span>
    </div>

    <div class="poss-ex-list">

      <div class="poss-ex-block">
        <div class="poss-ex-tag ppa-tag">PPA</div>
        <div class="poss-ex-sentences">
          <div class="poss-ex-sent pt"><span class="poss-hl-adj">Meu</span> <span class="poss-hl-noun">carro</span> é legal.</div>
          <div class="poss-ex-note">O pronome de posse <span class="poss-hl-adj">"meu"</span> está antes da posse <span class="poss-hl-noun">"carro"</span> → usamos <strong>PPA</strong>.</div>
          <div class="poss-ex-sent en"><span class="en" data-speak="My car is nice."><span class="poss-hl-adj">My</span> <span class="poss-hl-noun">car</span> is nice.</span></div>
        </div>
      </div>

      <div class="poss-ex-block">
        <div class="poss-ex-tag ppa-tag">PPA</div>
        <div class="poss-ex-sentences">
          <div class="poss-ex-sent pt">O <span class="poss-hl-noun">carro</span> <span class="poss-hl-pp">dela</span> é legal.</div>
          <div class="poss-ex-note">O pronome de posse está depois da posse — isso não pode. Colocamos antes e usamos <strong>PPA</strong>. Sem <em>the</em> antes do pronome.</div>
          <div class="poss-ex-sent en"><span class="en" data-speak="Her car is nice."><span class="poss-hl-pp">Her</span> <span class="poss-hl-noun">car</span> is nice.</span></div>
        </div>
      </div>

      <div class="poss-ex-block">
        <div class="poss-ex-tag pp-tag">PP</div>
        <div class="poss-ex-sentences">
          <div class="poss-ex-sent pt">O carro <span class="poss-hl-tobe">é</span> <span class="poss-hl-pp">dela</span>.</div>
          <div class="poss-ex-note">O pronome de posse está logo após um <span class="poss-hl-tobe">verbo to be</span> → traduzimos ao pé da letra e usamos <strong>PP</strong>.</div>
          <div class="poss-ex-sent en"><span class="en" data-speak="The car is hers.">The car <span class="poss-hl-tobe">is</span> <span class="poss-hl-pp">hers</span>.</span></div>
        </div>
      </div>

    </div>

      <div class="poss-ex-block">
        <div class="poss-ex-tag pp-tag">OF + PP</div>
        <div class="poss-ex-sentences">
          <div class="poss-ex-note">Quando quisermos usar pronomes de posse com algum <span onclick="scrollAndHighlight('16:art-a-an')" style="color:var(--blue);font-weight:700;cursor:pointer;text-decoration:underline;">artigo indefinido</span> (a, an, some), traduziremos ao pé da letra, mas no local do pronome de posse utilizaremos <strong>of + PP</strong>.</div>
          <div class="poss-ex-sent pt">Um amigo <span class="poss-hl-pp">dela</span>.</div>
          <div class="poss-ex-sent en"><span class="en" data-speak="A friend of hers.">A friend of <span class="poss-hl-pp">hers</span>.</span></div>
        </div>
      </div>

    <div class="tip" style="margin-top:12px;">
      <div class="tip-lbl">📌 Observação</div>
      <p class="tip-txt">No futuro veremos que podemos usar o <span class="poss-hl-pp"><strong>PP</strong></span> em algumas outras situações.</p>
    </div>

    <div class="rule-box" style="margin-top:12px;" id="poss-seu-atencao">
      <div class="rule-title">⚠️ Cuidado com seu(s), sua(s)</div>
      <p style="font-size:13px;color:var(--s);line-height:1.7;margin-bottom:10px;">Em português podemos usar <strong>seu/sua</strong> para a terceira pessoa. Mas em inglês, se traduzirmos como <span class="poss-hl-adj"><strong>your</strong></span>, o cachorro não vai ser do Brian — vai ser <strong>seu</strong>!</p>
      <div class="quote-list">
        <div class="quote">
          <div class="q-pt">Brian está passeando com <span class="poss-hl-adj">seu</span> cachorro.</div>
          <div class="q-note" style="color:var(--red);">❌ Brian is walking with <span class="poss-hl-adj">your</span> dog. <em>(o cachorro não é do Brian)</em></div>
        </div>
        <div class="quote">
          <div class="q-pt">Brian está passeando com o cachorro <strong>dele</strong>.</div>
          <div class="q-note" style="color:var(--green);">✓ Neste caso, usamos <strong>dele</strong> para deixar claro de quem é.</div>
          <div class="q-en"><span class="en" data-speak="Brian is walking with his dog.">Brian is walking with <span class="poss-hl-adj">his</span> dog.</span></div>
        </div>
      </div>
    </div>

  </div>
  <div class="ex-wrap"><div class="ex-header"><span class="ex-title">Pronomes de Posse — exercício</span><span class="ex-score" id="poss-score">0/10</span></div><div class="ex-body" id="poss-body"></div></div>
</div>`,

`<div class="page pg-content" style="--acc:#68d391;">
  <div class="pg-hd"><div class="pg-lbl">Seção 17 · Caso Possessivo e Of</div><div class="pg-ttl">Caso Possessivo e Of</div></div>
  <div class="pg-body">

    <p class="intro" id="cp-intro">Ao contrário da matéria anterior, onde indicávamos o dono com pronomes, aqui utilizaremos <strong>nomes reais</strong>.</p>

    <div class="sub-label" id="cp-humanos">Humanos e animais — Caso Possessivo</div>

    <div class="cp-formula" id="cp-formula1">
      <div class="cp-formula-label">Fórmula — 1 dono</div>
      <div class="cp-formula-body">
        <span class="cp-f-dono">dono</span>
        <span class="cp-f-op">'s</span>
        <span class="cp-f-plus">+</span>
        <span class="cp-f-posse">posse</span>
      </div>
    </div>

    <div class="quote-list">
      <div class="quote">
        <div class="q-pt">O <span class="cp-f-posse">carro</span> do <span class="cp-f-dono">professor</span>.</div>
        <div class="q-en"><span class="en" data-speak="The teacher's car.">The <span class="cp-f-dono">teacher</span><span class="cp-f-op">'s</span> <span class="cp-f-posse">car</span>.</span></div>
      </div>
      <div class="quote">
        <div class="q-pt">O <span class="cp-f-posse">carro</span> da <span class="cp-f-dono">Ashley</span>.</div>
        <div class="q-en"><span class="en" data-speak="Ashley's car."><span class="cp-f-dono">Ashley</span><span class="cp-f-op">'s</span> <span class="cp-f-posse">car</span>.</span></div>
        <div class="q-note">Retiramos o <em>the</em> porque Ashley é nome próprio.</div>
      </div>
      <div class="quote">
        <div class="q-pt">O <span class="cp-f-posse">carro</span> do <span class="cp-f-dono">amigo</span> dela.</div>
        <div class="q-en"><span class="en" data-speak="Her friend's car.">Her <span class="cp-f-dono">friend</span><span class="cp-f-op">'s</span> <span class="cp-f-posse">car</span>.</span></div>
      </div>
    </div>

    <div class="cp-formula" id="cp-formula2" style="margin-top:16px;">
      <div class="cp-formula-label">Fórmula — 2 ou mais donos</div>
      <div class="cp-formula-body">
        <span class="cp-f-dono2">dono²</span>
        <span class="cp-f-op">'s</span>
        <span class="cp-f-plus">+</span>
        <span class="cp-f-dono">dono¹</span>
        <span class="cp-f-op">'s</span>
        <span class="cp-f-plus">+</span>
        <span class="cp-f-posse">posse</span>
      </div>
    </div>

    <div class="quote-list">
      <div class="quote">
        <div class="q-pt">O <span class="cp-f-posse">carro</span> do <span class="cp-f-dono">amigo¹</span> do <span class="cp-f-dono2">professor²</span>.</div>
        <div class="q-en"><span class="en" data-speak="The teacher's friend's car.">The <span class="cp-f-dono2">teacher</span><span class="cp-f-op">'s</span> <span class="cp-f-dono">friend</span><span class="cp-f-op">'s</span> <span class="cp-f-posse">car</span>.</span></div>
      </div>
      <div class="quote">
        <div class="q-pt">O <span class="cp-f-posse">carro</span> do <span class="cp-f-dono">amigo¹</span> da <span class="cp-f-dono2">Ashley²</span>.</div>
        <div class="q-en"><span class="en" data-speak="Ashley's friend's car."><span class="cp-f-dono2">Ashley</span><span class="cp-f-op">'s</span> <span class="cp-f-dono">friend</span><span class="cp-f-op">'s</span> <span class="cp-f-posse">car</span>.</span></div>
        <div class="q-note">Retiramos o <em>the</em> porque Ashley é nome próprio.</div>
      </div>
    </div>

    <div class="tip yel" id="cp-s-obs" style="margin-top:14px;">
      <div class="tip-lbl">📌 Nome terminando em S</div>
      <p class="tip-txt">Se o nome terminar com <strong>s</strong>, adicionamos apenas o apóstrofo e pronunciamos <em>-sses</em>.</p>
      <div class="quote-list" style="margin-top:8px;">
        <div class="quote">
          <div class="q-pt">O <span class="cp-f-posse">carro</span> do <span class="cp-f-dono">Lucas</span>.</div>
          <div class="q-en"><span class="en" data-speak="Lucas' car."><span class="cp-f-dono">Lucas</span><span class="cp-f-op">'</span> <span class="cp-f-posse">car</span>.</span></div>
        </div>
      </div>
    </div>

    <div class="sub-label" id="cp-of">Inanimados e cargos — OF</div>

    <p class="intro">Quando o dono é algo <strong>inanimado</strong> ou quando é <strong>título/cargo</strong>, utilizamos:</p>

    <p class="intro"><span class="en" data-speak="of">Of</span> = <strong>de</strong> &nbsp;·&nbsp; <span class="en" data-speak="of the">of the</span> = <strong>do, da, dos, das</strong> <span class="q-tr">(atentar às regras onde o <em>the</em> tem que sumir)</span></p>

    <div class="quote-list">
      <div class="quote">
        <div class="q-pt">O final do filme.</div>
        <div class="q-en"><span class="en" data-speak="The end of the movie.">The end <strong>of the</strong> movie.</span></div>
      </div>
      <div class="quote">
        <div class="q-pt">A porta do carro.</div>
        <div class="q-en"><span class="en" data-speak="The door of the car.">The door <strong>of the</strong> car.</span></div>
      </div>
      <div class="quote">
        <div class="q-pt">O presidente da república.</div>
        <div class="q-en"><span class="en" data-speak="The president of the republic.">The president <strong>of the</strong> republic.</span></div>
      </div>
      <div class="quote">
        <div class="q-pt">O Senhor dos Anéis.</div>
        <div class="q-en"><span class="en" data-speak="The Lord of The Rings.">The Lord <strong>of The</strong> Rings.</span></div>
      </div>
    </div>

    <div class="tip" id="cp-of-obs" style="margin-top:14px;">

let backState=null;
function goAndHighlight(pageIdx, targetId){
  backState={page:cur, scrollTop:document.getElementById('slides').scrollTop};
  go(pageIdx);
  setTimeout(()=>{
    const el=document.getElementById(targetId);
    if(!el)return;
    // remove any previous inline back btn
    const old=document.getElementById('inline-back-btn');
    if(old)old.remove();
    // insert inline back btn right above the target element
    const btn=document.createElement('button');
    btn.id='inline-back-btn';
    btn.innerHTML='← Voltar';
    btn.onclick=goBack;
    el.parentNode.insertBefore(btn,el);
    btn.scrollIntoView({behavior:'smooth',block:'center'});
    let target=el;
    while(target.parentElement&&!target.classList.contains('rule-box')&&!target.classList.contains('tip')&&!target.classList.contains('pron-section')&&!target.classList.contains('tobe-card')&&target.id!=='art-a-an'&&!target.classList.contains('pg-body')){target=target.parentElement;}
    target.classList.add('highlight-pulse');
    setTimeout(()=>target.classList.remove('highlight-pulse'),5000);
  },350);
}
function goBack(){
  if(!backState)return;
  const s=backState;backState=null;
  const old=document.getElementById('inline-back-btn');
  if(old)old.remove();
  go(s.page);
  setTimeout(()=>{document.getElementById('slides').scrollTop=s.scrollTop;},350);
}

function buildGenPrompt(subjects,theme){
  const has=id=>subjects.includes(id);
  const allowed=[];
  const forbidden=[];
  allowed.push('Sujeitos: I, you, he, she, it, we, they. Nomes próprios: Ryan, Ashley, Megan, Josh, Jake, Taylor, Camila, Douglas, Renato, Raphael, Vanessa, Brian, Ethan, Sofia, Lucas, Emma, Noah, Olivia, Liam.');
  if(has('s02')){allowed.push('S02 To Be presente: am,is,are (afirm). ain\'t,isn\'t,aren\'t (neg). Is/Are/Isn\'t/Aren\'t? (interrog). Contrações: I\'m,you\'re,he\'s,she\'s,it\'s,we\'re,they\'re.');}
  else{forbidden.push('S02 PROIBIDO to be presente: am,is,are,ain\'t,isn\'t,aren\'t,I\'m,you\'re,he\'s,she\'s,it\'s,we\'re,they\'re.');}
  if(has('s03')){allowed.push('S03 Gerúndio: to be presente + verbo-ing.');}
  else{forbidden.push('S03 PROIBIDO gerúndio: nenhum verbo-ing com to be.');}
  if(has('s04')){allowed.push('S04 Adjetivos simples antes do substantivo ou após to be. Combinações noun+noun (plastic bottle).');}
  else{forbidden.push('S04 PROIBIDO adjetivos descritivos e combinações noun+noun.');}
  if(has('s05')||has('s06')){allowed.push('S05/S06 Artigos: a,an,the,some+plural,some+singular. Nomes próprios de pessoas: sem artigo.');}
  else{forbidden.push('S05/S06 PROIBIDO artigos: a,an,the,some.');}
  if(has('s07')){allowed.push('S07 Presente simples: APENAS afirmativo. I/you/we/they+verbo base. He/she/it+verbo+s/es/ies. have→has.');}
  else{forbidden.push('S07 PROIBIDO presente simples de verbos de ação: eat,work,play,watch,buy,like,love,study,live,etc.');}
  if(has('s08')){allowed.push('S08 Passado simples: APENAS afirmativo. Regulares:+ed. Irregulares: forma própria. Verbo não muda por pronome.');}
  else{forbidden.push('S08 PROIBIDO passado simples de verbos de ação: played,watched,bought,ate,slept,saw,etc.');}
  if(has('s09')){allowed.push('S09 Futuro: will+verbo (afirm). won\'t+verbo (neg). Will/Won\'t+sujeito+verbo? (interrog).');}
  else{forbidden.push('S09 PROIBIDO will/won\'t com verbos de ação.');}
  if(has('s10')){allowed.push('S10 To Go: go/goes (recorrência presente). went (passado). will go/won\'t go (futuro). Will/Won\'t go? (interrog). was/wasn\'t (estado singular passado). were/weren\'t (estado plural passado).');}
  else{forbidden.push('S10 PROIBIDO: go,goes,went,will go,won\'t go.'+(has('s02')?'':' PROIBIDO: was,wasn\'t,were,weren\'t.'));}
  if(has('s11')){allowed.push('S11 Sujeito oculto: 2 a 3 frases com sujeito oculto em português (ex: "Comprei um carro."=I, "Estava chovendo."=it).');}
  else{forbidden.push('S11 PROIBIDO sujeito oculto. Toda frase deve ter sujeito explícito.');}
  if(has('s12')){allowed.push('S12 Preposições: in,on,at (e in the,on the,at the) de tempo e lugar.');}
  else{forbidden.push('S12 PROIBIDO preposições in,on,at.');}
  if(has('s13')){allowed.push('S13 Demonstrativos: this,these,that,those,here,there.');}
  else{forbidden.push('S13 PROIBIDO demonstrativos: this,these,that,those,here,there.');}
  if(has('s14')){allowed.push('S14 Combinações in/on/at+this/these/that/those.');}
  else{forbidden.push('S14 PROIBIDO combinar in/on/at com demonstrativos.');}
  if(has('s15')){allowed.push('S15 Pronome relativo: that (coringa), who (humanos), which (animais/objetos).');}
  else{forbidden.push('S15 PROIBIDO pronomes relativos that/who/which como "que" explicativo.');}
  if(has('s16')){allowed.push('S16 PPA: my,your,his,her,its,our,their. PP: mine,yours,his,hers,its,ours,theirs. of+PP. NUNCA "seu/sua" para 3ª pessoa em PT.');}
  else{forbidden.push('S16 PROIBIDO pronomes de posse: my,your,his,her,its,our,their,mine,yours,hers,ours,theirs.');}
  if(has('s17')){allowed.push('S17 Caso possessivo: dono+\'s+posse. Nome em S: só apóstrofo. Inanimados: of/of the.');}
  else{forbidden.push('S17 PROIBIDO caso possessivo com \'s ou \'. PROIBIDO "of the" para posse.');}

  const globalRule='REGRA GLOBAL: Perguntas e negativos SÓ com: am,ain\'t,is,isn\'t,are,aren\'t,was,wasn\'t,were,weren\'t,will,won\'t. Presente e passado simples são SEMPRE afirmativos.';
  const vocabRule='VOCABULÁRIO — REGRA ABSOLUTA: toda palavra que o aluno precisa saber para traduzir VAI no vocabulário de CADA frase em que aparece — sem exceção e sem omitir repetições. Inclua: substantivos, verbos (SEMPRE no infinitivo), adjetivos, advérbios (muito=very, sempre=always, nunca=never, hoje=today, amanhã=tomorrow, agora=now, ontem=yesterday, bem=well, tarde=late, cedo=early, etc.) e qualquer outra palavra de conteúdo. NUNCA inclua: artigos, pronomes pessoais, pronomes de posse, to be, will/won\'t, go/goes/went, preposições in/on/at, demonstrativos. Pronúncia aproximada em PT. Máx 6, mín 1.';
  const dir=window._genDir||'pt-en';
  const dirLabel=dir==='pt-en'?'em PORTUGUÊS para o aluno traduzir para o INGLÊS':'em INGLÊS para o aluno traduzir para o PORTUGUÊS';
  const fmt=dir==='pt-en'?'{"frases":[{"pt":"frase","vocab":[{"pt":"palavra","en":"palavra","pron":"pronúncia"}]}]}':'{"frases":[{"en":"sentence","vocab":[{"pt":"palavra","en":"palavra","pron":"pronúncia"}]}]}';
  const defaultTheme='business, cultura pop, música, filmes, séries, notícias. Pode usar nomes reais de empresas (Netflix,Spotify,Apple,iFood,Uber) e famosos.';

  return `Você é um gerador preciso de frases para lição de casa de inglês. Gere exatamente 3 frases ${dirLabel}. Responda APENAS com JSON minificado numa única linha, sem espaços extras, sem markdown.

${globalRule}

PERMITIDO:
${allowed.map(r=>'✅ '+r).join('\n')}

PROIBIDO:
${forbidden.map(r=>'❌ '+r).join('\n')}

TEMA: ${theme&&theme.trim()?theme.trim():defaultTheme}

REGRAS ADICIONAIS:
1. Antes de cada frase, verifique: cada palavra está no PERMITIDO? Se não, reescreva.
2. NUNCA "seu/sua/seus/suas" para 3ª pessoa. Use "dele/dela/deles/delas".
3. NUNCA "assistindo a","ir ao","ir à","ao/aos/à/às". Use "para o/a/os/as".
4. Futuro em PT: "vou/vai/vamos/vão + infinitivo".
5. Varie ao máximo os tipos de frase disponíveis.

${vocabRule}

FORMATO — JSON puro sem markdown:
${fmt}`;
}

async function callGen(prompt){
  const resp=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,max_tokens:2000})});
  const data=await resp.json();
  const raw=(data.text||data.error||'').trim().replace(/^```json[\s\S]*?(\{)/,'$1').replace(/```[\s\S]*$/,'').trim();
  // Se JSON incompleto, tentar fechar
  let text=raw;
  try{return JSON.parse(text);}catch(e){
    // Tentar reparar JSON truncado
    let fixed=text;
    const opens=((fixed.match(/\{/g)||[]).length);
    const closes=((fixed.match(/\}/g)||[]).length);
    for(let i=0;i<opens-closes;i++)fixed+='}}';
    try{return JSON.parse(fixed);}catch(e2){throw new Error('JSON truncado mesmo após reparo');}
  }
}
async function generar(){
  const free=window._genFree||false;
  const chips=[...document.querySelectorAll('.gen-chip.on')].map(c=>c.dataset.id);
  if(!free&&!chips.length){const e=document.getElementById('gen-error');e.textContent='Selecione pelo menos uma matéria.';e.style.display='block';return;}
  const theme=document.getElementById('gen-theme').value;
  const btn=document.getElementById('gen-btn');
  const loading=document.getElementById('gen-loading');
  const result=document.getElementById('gen-result');
  const errEl=document.getElementById('gen-error');
  btn.disabled=true;loading.style.display='block';result.innerHTML='';errEl.style.display='none';
  try{
    const p1=free?buildFreePrompt(theme):buildGenPrompt(chips,theme);
    const allFrases=[];
    for(let i=0;i<4;i++){
      loading.textContent='⏳ Gerando frases ('+(i+1)+'/4)...';
      const r=await callGen(p1);
      allFrases.push(...(r.frases||[]));
      if(allFrases.length>=10)break;
    }
    const parsed={frases:allFrases.slice(0,10)};
    const text='ok'; // dummy
    // parsed já definido acima
    const dir=window._genDir||'pt-en';
    const frases=parsed.frases;
    result.innerHTML=frases.map((f,i)=>{
      const sentence=dir==='pt-en'?f.pt:f.en;
      return `${i>0?'<hr class="gen-divider">':''}
      <div class="gen-sentence-block">
        <div class="gen-sentence-pt">${i+1}. ${sentence}</div>
        <div class="gen-vocab-label">Vocabulário</div>
        <div class="gen-vocab">${f.vocab.map(v=>`<div class="gen-vocab-item">${v.pt} = <strong>${v.en}</strong> <span class="pron">(${v.pron})</span></div>`).join('')}</div>
      </div>`;
    }).join('');
    window._genText=frases.map((f,i)=>{
      const sentence=dir==='pt-en'?f.pt:f.en;
      const vocab=f.vocab.map(v=>`  ${v.pt} = ${v.en} (${v.pron})`).join('\n');
      return `${i+1}. ${sentence}\n\n${vocab}`;
    }).join('\n\n——————\n\n');
    document.getElementById('gen-copy-btn').style.display='block';
  }catch(e){
    let msg='Erro ao gerar frases. Tente novamente.';
    if(e&&e.message)msg+=' ('+e.message+')';
    errEl.textContent=msg;errEl.style.display='block';
    console.error('GEN ERROR:',e);
  }finally{
    btn.disabled=false;loading.style.display='none';
  }
}
function genCopy(){
  if(!window._genText)return;
  const btn=document.getElementById('gen-copy-btn');
  const orig=btn.innerHTML;
  function done(ok){btn.innerHTML=ok?'✅ Copiado!':'❌ Erro';setTimeout(()=>{btn.innerHTML=orig;},2000);}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(window._genText).then(()=>done(true)).catch(()=>fallback());
  } else {fallback();}
  function fallback(){
    const ta=document.createElement('textarea');
    ta.value=window._genText;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.focus();ta.select();
    try{done(document.execCommand('copy'));}catch(e){done(false);}
    document.body.removeChild(ta);
  }
}

function idxSearch(q){
  const clear=document.getElementById('idx-search-clear');
  if(clear)clear.style.display=q?'block':'none';
  // Expand all chapters when searching, collapse when empty
  document.querySelectorAll('.idx-chapter').forEach(c=>{
    if(q) c.classList.remove('closed');
    else c.classList.add('closed');
  });
  const items=document.querySelectorAll('#idx-list .idx-item');
  const groups=document.querySelectorAll('#idx-list .idx-group');
  const noRes=document.getElementById('idx-no-result');
  const term=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  let anyVisible=false;
  items.forEach(el=>{
    const kw=(el.dataset.kw||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const name=el.querySelector('.idx-name')?.textContent.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')||'';
    const desc=el.querySelector('.idx-desc')?.textContent.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')||'';
    const match=!term||kw.includes(term)||name.includes(term)||desc.includes(term);
    el.toggleAttribute('data-hidden',!match);
    if(match)anyVisible=true;
  });
  groups.forEach(g=>{
    let sib=g.nextElementSibling;let hasVisible=false;
    while(sib&&!sib.classList.contains('idx-group')){if(!sib.hasAttribute('data-hidden'))hasVisible=true;sib=sib.nextElementSibling;}
    g.toggleAttribute('data-hidden',!hasVisible);
  });
  if(noRes)noRes.style.display=anyVisible||!term?'none':'block';
}

  if(inp){inp.value='';inp.focus();}
  idxSearch('');
}

    sheet.innerHTML=`<div class="tsheet-backdrop" onclick="closeThemePicker()"></div>
<div class="tsheet-panel">
  <div class="tsheet-title">Escolher tema</div>
  <div class="tsheet-grid" id="tsheet-grid"></div>
</div>`;
    document.body.appendChild(sheet);
    const grid=document.getElementById('tsheet-grid');
    const curName=localStorage.getItem('hse-theme-name')||'standard';
    const curMode=localStorage.getItem('hse-theme')||'dark';
    THEMES.forEach(t=>{
      const btn=document.createElement('button');
      btn.className='tsheet-item'+(curName===t.id?' tsheet-active':'');
      btn.innerHTML=`<span class="tsheet-swatch" style="background:linear-gradient(135deg,${t.dark} 50%,${t.light} 50%)"></span><span class="tsheet-lbl">${t.label}</span>`;
      btn.onclick=()=>{
        document.querySelectorAll('.tsheet-item').forEach(b=>b.classList.remove('tsheet-active'));
        btn.classList.add('tsheet-active');
        const mode=document.body.classList.contains('dark')?'dark':'light';
        applyTheme(t.id, mode);
        setTimeout(closeThemePicker, 300);
      };
      grid.appendChild(btn);
    });
  }
  sheet.classList.add('open');
}

function closeThemePicker(){
  const s=document.getElementById('theme-sheet');
  if(s)s.classList.remove('open');
}

function updateThemeUI(){
  const curName=localStorage.getItem('hse-theme-name')||'standard';
  document.querySelectorAll('.tsheet-item').forEach((b,i)=>{
    b.classList.toggle('tsheet-active', THEMES[i]&&THEMES[i].id===curName);
  });
  const isDark=document.body.classList.contains('dark');
  document.querySelectorAll('.sec-mode-btn').forEach(b=>{
    b.textContent=isDark?'☀️ Light':'🌙 Dark';
  });
  const themeBtn=document.getElementById('theme-toggle');
  if(themeBtn)themeBtn.className='sp-toggle '+(isDark?'on':'off');
}

// Init theme on load
(function(){
  const name=localStorage.getItem('hse-theme-name')||'standard';
  const mode=localStorage.getItem('hse-theme')||'dark';
  if(name!=='standard') document.body.classList.add('t-'+name);
  document.body.classList.add(mode);
})();

go(0);

</script>
</body>
