`<div class="page pg-content">
  <div class="pg-hd"><div class="pg-lbl">Seção 10 · To Go</div><div class="pg-ttl">Ir</div></div>
  <div class="pg-body">
    <div class="rule-box" id="togo-will-vs-go">
      <div class="rule-title">⚠️ Observação importante</div>
      <p class="intro">É importante não confundirmos o verbo <strong>go</strong> com o verbo auxiliar <strong>will</strong>. Isso ocorre porque ambos têm a mesma tradução (vou, vai, vamos, vão).</p>
      <div class="eg-block" style="margin-top:12px;">
        <div class="eg-row" style="flex-direction:column;align-items:flex-start;gap:4px;">
          <span class="eg-pt">Raphael vai viajar para Nova Iorque.</span>
          <span class="eg-en en" data-speak="Raphael will travel to New York">Raphael <span class="hl-will">will</span> travel to New York.</span>
          <span style="font-size:11px;color:var(--m);">→ vai + verbo: usamos will</span>
        </div>
        <div class="eg-row" style="flex-direction:column;align-items:flex-start;gap:4px;">
          <span class="eg-pt">Raphael vai para Nova Iorque.</span>
          <span class="eg-en en" data-speak="Raphael goes to New York">Raphael <span class="hl-go">goes</span> to New York.</span>
          <span style="font-size:11px;color:var(--m);">→ vai + lugar: usamos go</span>
        </div>
      </div>
    </div>
    <div class="rule-box">
      <div class="rule-title">Presente — recorrência</div>
      <p class="intro"><span class="en" data-speak="Go">Go</span> = I, You, We, They &nbsp;·&nbsp; <span class="en" data-speak="Goes">Goes</span> = He, She, It</p>
      <p class="intro">Utilizamos o verbo ir no presente para indicar recorrência.</p>
      <div class="eg-block" style="margin-top:10px;">
        <div class="eg-row"><span class="eg-pt">Eu sempre vou ao supermercado.</span><span class="eg-en en" data-speak="I always go to the supermarket">I always <span class="hl-go">go</span> to the supermarket.</span></div>
        <div class="eg-row"><span class="eg-pt">Ela vai ao restaurante quando está faminta.</span><span class="eg-en en" data-speak="She goes to the restaurant when she is hungry">She <span class="hl-go">goes</span> to the restaurant when she is hungry.</span></div>
        <div class="eg-row"><span class="eg-pt">Douglas vai para o estúdio todo final de semana.</span><span class="eg-en en" data-speak="Douglas goes to the studio every weekend">Douglas <span class="hl-go">goes</span> to the studio every weekend.</span></div>
      </div>
    </div>
    <div class="rule-box" id="togo-went">
      <div class="rule-title">Passado — went (fui, foi, fomos, foram)</div>
      <p class="intro">Quando quisermos indicar deslocamento para algum local no passado, utilizamos <span class="en" data-speak="went">went</span>.</p>
      <div class="eg-block" style="margin-top:10px;">
        <div class="eg-row"><span class="eg-pt">Eu fui ao supermercado.</span><span class="eg-en en" data-speak="I went to the supermarket">I <span class="hl-go">went</span> to the supermarket.</span></div>
        <div class="eg-row"><span class="eg-pt">Ela foi ao restaurante ontem.</span><span class="eg-en en" data-speak="She went to the restaurant yesterday">She <span class="hl-go">went</span> to the restaurant yesterday.</span></div>
        <div class="eg-row"><span class="eg-pt">Douglas e Bruno foram ao estúdio semana passada.</span><span class="eg-en en" data-speak="Douglas and Bruno went to the studio last week">Douglas and Bruno <span class="hl-go">went</span> to the studio last week.</span></div>
      </div>
    </div>
    <div class="rule-box" id="togo-went-vs-tobe">
      <div class="rule-title">Went ou Verbo To Be?</div>
      <p class="intro">Em português, usamos fui, foi, fomos e foram para indicar deslocamento, mas também para indicar estado ou identidade — algo que não ocorre em inglês.</p>
      <div class="eg-block" style="margin-top:10px;">
        <div class="eg-row" style="flex-direction:column;align-items:flex-start;gap:2px;">
          <span class="eg-pt">Camila foi feliz. (= Camila era feliz.)</span>
          <span class="eg-en en" data-speak="Camila was happy">Camila <span class="hl-tobe">was</span> happy.</span>
        </div>
        <div class="eg-row" style="flex-direction:column;align-items:flex-start;gap:2px;">
          <span class="eg-pt">Renato e Bruno foram amigos. (= eram amigos.)</span>
          <span class="eg-en en" data-speak="Renato and Bruno were friends">Renato and Bruno <span class="hl-tobe">were</span> friends.</span>
        </div>
      </div>
      <div class="tip" style="margin-top:10px;">
        <div class="tip-lbl">📌 Regra rápida</div>
        <p class="tip-txt">Fui, foi = era, estava → <span class="en" data-speak="was">was</span> ou <span class="en" data-speak="wasn't">wasn't</span><br>Fomos, foram = éramos, estávamos → <span class="en" data-speak="were">were</span> ou <span class="en" data-speak="weren't">weren't</span></p>
      </div>
    </div>
    <div class="rule-box">
      <div class="rule-title">Futuro — will go / won't go</div>
      <p class="intro">Para o futuro, acrescentamos <span class="en" data-speak="will">will</span> ou <span class="en" data-speak="won't">won't</span> antes do go.</p>
      <div class="eg-block" style="margin-top:10px;">

        <div class="eg-row"><span class="eg-pt">Douglas não vai ao estúdio semana que vem.</span><span class="eg-en en" data-speak="Douglas won't go to the studio next week">Douglas <span class="hl-wont">won't go</span> to the studio next week.</span></div>
      </div>
    </div>
    <div class="rule-box" id="togo-tabela">

      <div class="togo-table">
        <div class="togo-section">

          <div class="togo-row"><div class="togo-cond">Se estiver para um lugar — futuro</div><div class="togo-val"><span class="en" data-speak="will go">will go</span> ou <span class="en" data-speak="won't go">won't go</span></div></div>
          <div class="togo-row"><div class="togo-cond">Se estiver para um lugar — recorrência</div><div class="togo-val"><span class="en" data-speak="go">go</span> ou <span class="en" data-speak="goes">goes</span></div></div>
        </div>
        <div class="togo-sep"></div>
        <div class="togo-section">

/* ── ENGINE ── */
let cur=0;
function toggleTheme(){
  const d=document.body.classList.contains('dark');
  document.body.classList.toggle('dark',!d);document.body.classList.toggle('light',d);
  localStorage.setItem('hse-theme',d?'light':'dark');
  const btn=document.getElementById('theme-toggle');
  if(btn)btn.className='sp-toggle '+(d?'off':'on');
}
const sv=localStorage.getItem('hse-theme');
if(sv==='light')document.body.classList.replace('dark','light');

let backState=null;
function goAndHighlight(pageIdx, targetId){
  backState={page:cur, scrollTop:document.getElementById('slides').scrollTop};
  go(pageIdx);
  setTimeout(()=>{
    const el=document.getElementById(targetId);
    if(!el)return;
    // remove any previous inline back btn
    const old=document.getElementById('inline-back-btn');
    if(old)old.remove();
    // insert inline back btn right above the target element
    const btn=document.createElement('button');
    btn.id='inline-back-btn';
    btn.innerHTML='← Voltar';
    btn.onclick=goBack;
    el.parentNode.insertBefore(btn,el);
    btn.scrollIntoView({behavior:'smooth',block:'center'});
    el.classList.add('highlight-pulse');
    setTimeout(()=>el.classList.remove('highlight-pulse'),5000);
  },350);
}
function goBack(){
  if(!backState)return;
  const s=backState;backState=null;
  const old=document.getElementById('inline-back-btn');
  if(old)old.remove();
  go(s.page);
  setTimeout(()=>{document.getElementById('slides').scrollTop=s.scrollTop;},350);
}

function go(i){
  if(i<0||i>=pages.length)return;
  cur=i;
  const _accMap={5:'var(--blue)',6:'var(--blue)',7:'var(--green)',8:'var(--green)',
    9:'var(--purple)',10:'var(--purple)',11:'var(--yel)',12:'var(--yel)',
    14:'var(--red)',15:'var(--red)',16:'var(--blue)',17:'var(--blue)',18:'var(--yel)',
    110:'var(--green)',20:'var(--green)',21:'var(--purple)',22:'var(--purple)',
    24:'var(--yel)',25:'var(--yel)',26:'var(--red)',27:'var(--red)',
    28:'var(--blue)',29:'var(--blue)',210:'var(--yel)'};
  if(_accMap[i])document.body.style.setProperty('--acc',_accMap[i]);
  window.speechSynthesis&&window.speechSynthesis.cancel();
  if(chatOpen)closeChat();
  document.getElementById('slides').innerHTML=pages[cur];
  document.getElementById('slides').scrollTop=0;
  if(cur===2){
    const sb=document.getElementById('shimmer-toggle');if(sb)sb.className='sp-toggle '+(document.body.classList.contains('no-shimmer')?'off':'on');
    const tb=document.getElementById('theme-toggle');if(tb)tb.className='sp-toggle '+(document.body.classList.contains('dark')?'on':'off');
  }
  if(cur>3){const hd=document.querySelector('.pg-hd');if(hd&&!hd.querySelector('.hd-idx-btn')){const b=document.createElement('button');b.className='hd-idx-btn';b.textContent='← Índice';b.onclick=()=>go(2);hd.appendChild(b);}}
  document.getElementById('ctr').textContent=(cur+1)+' / '+pages.length;
  document.getElementById('prog-fill').style.width=((cur+1)/pages.length*100)+'%';
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===pages.length-1;  if(cur===6)initPronGame();
  if(cur===8)initGame();
  if(cur===10)initEx('ing',window['ing_bk'],10);
  if(cur===12)initEx('tobe',window['tobe_bk'],12);
  if(cur===14)initEx('adj',window['adj_bk'],12);
  if(cur===16)initEx('art',window['art_bk'],12);
  if(cur===17)initEx('rev',window['rev_bk'],15);
  if(cur===20)initEx('pres',window['pres_bk'],10);
  if(cur===22)initEx('past',window['past_bk'],10);
  if(cur===24)initEx('fut',window['fut_bk'],10);
  if(cur===26)initEx('togo',window['togo_bk'],10);
  if(cur===28)initEx('suj',window['suj_bk'],10);
  if(cur===29)initEx('rev2',window['rev2_bk'],15);
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(cur+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);
});
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50&&!chatOpen)go(dx<0?cur+1:cur-1);
},{passive:true});

(function(){

})();

let activeTool=null;
function openTool(id){
  activeTool=id;
  document.getElementById('tool-menu').style.display='none';
  const panel=document.getElementById('tool-panel');
  panel.style.display='flex';
  document.getElementById('tool-panel-body').innerHTML=toolTemplates[id]||'';
  if(id==='dictation'){dicLevel='easy';}
}
function closeTool(){
  activeTool=null;
  document.getElementById('tool-panel').style.display='none';
  document.getElementById('tool-menu').style.display='flex';
  window.speechSynthesis&&window.speechSynthesis.cancel();
}
let trlDir='pt-en';
function setTrlDir(d){
  trlDir=d;
  document.getElementById('trl-pt-en').classList.toggle('active',d==='pt-en');
  document.getElementById('trl-en-pt').classList.toggle('active',d==='en-pt');
  document.getElementById('trl-input').placeholder=d==='pt-en'?'Digite para traduzir...':'Type to translate...';
  document.getElementById('trl-result').textContent='';
  clearTimeout(trlTimer);
}
let trlTimer;
function trlTyping(){
  clearTimeout(trlTimer);
  const v=document.getElementById('trl-input').value.trim();
  if(!v){document.getElementById('trl-result').textContent='';return;}
  document.getElementById('trl-result').innerHTML='<span class="tr-loading">Traduzindo...</span>';
  trlTimer=setTimeout(()=>callClaude(trlDir==='pt-en'?'Traduza para inglês americano. Responda APENAS com a tradução, sem explicação, sem aspas:\n'+v:'Translate to Brazilian Portuguese. Reply ONLY with the translation, no explanation, no quotes:\n'+v,res=>document.getElementById('trl-result').innerHTML='<strong>'+escHtml(res)+'</strong>'),700);
}
function toolSpeak(){
  if(!window.speechSynthesis)return;
  const v=document.getElementById('tts-input').value.trim();if(!v)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(v);u.lang='en-US';u.rate=.9;window.speechSynthesis.speak(u);
}
function toolSpeakSlow(){
  if(!window.speechSynthesis)return;
  const v=document.getElementById('tts-input').value.trim();if(!v)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(v);u.lang='en-US';u.rate=.45;window.speechSynthesis.speak(u);
}
function toolCorrect(){
  const v=document.getElementById('cor-input').value.trim();if(!v)return;
  const btn=document.getElementById('cor-btn');if(btn)btn.disabled=true;
  document.getElementById('cor-result').innerHTML='<span class="tr-loading">Verificando...</span>';
  callClaude('You are an English teacher. The student wrote: "'+v+'". If correct, reply exactly: OK. Se errado: ❌ <frase correta>\n💡 <explicação em português, máx 15 palavras>',res=>{document.getElementById('cor-result').innerHTML=res.split('\n').join('<br>');if(btn)btn.disabled=false;});
}
function toolExamples(){
  const v=document.getElementById('ex-input').value.trim();if(!v)return;
  const btn=document.getElementById('ex-btn');if(btn)btn.disabled=true;
  document.getElementById('ex-result').innerHTML='<span class="tr-loading">Gerando exemplos...</span>';
  callClaude('Give 3 short natural English sentences using "'+v+'". Everyday Brazilian context. Format: 1. <sentence> — <Portuguese translation>. Reply ONLY with the 3 examples.',res=>{document.getElementById('ex-result').innerHTML=res.split('\n').join('<br>');if(btn)btn.disabled=false;});
}
let dicCurrent='';
let dicLevel='easy';
function setDicLevel(level,btn){
  dicLevel=level;
  document.querySelectorAll('#dic-level-btns .tl-lvl-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  dicCurrent='';
  const s=document.getElementById('dic-sentence-txt');if(s)s.textContent='Toque em Nova frase para começar';
  const r=document.getElementById('dic-result');if(r)r.textContent='';
  const inp=document.getElementById('dic-input');if(inp)inp.value='';
}
function dicGenerate(){
  const btn=document.getElementById('dic-new-btn');if(btn)btn.disabled=true;
  const s=document.getElementById('dic-sentence-txt');const r=document.getElementById('dic-result');const inp=document.getElementById('dic-input');
  if(s)s.textContent='Gerando frase...';if(r)r.textContent='';if(inp)inp.value='';
  const lvlMap={easy:'simple vocab, present tense, 5-7 words',medium:'mixed tenses, 8-11 words, everyday Brazilian context',hard:'12-15 words, natural conversational English'};
  callClaude('Generate ONE English sentence for dictation. Level: '+lvlMap[dicLevel]+'. Reply ONLY with the sentence, no quotes.',res=>{dicCurrent=res.trim();if(s)s.textContent='Toque para ouvir ▶';if(btn)btn.disabled=false;dicSpeak();});
}
function dicSpeak(){
  if(!window.speechSynthesis||!dicCurrent)return;
  const s=document.getElementById('dic-sentence-txt');if(s)s.textContent='🔊 Ouvindo...';
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(dicCurrent);u.lang='en-US';u.rate=.7;
  u.onend=()=>{const s=document.getElementById('dic-sentence-txt');if(s)s.textContent='Toque para ouvir de novo ▶';};
  window.speechSynthesis.speak(u);
}
function dicCheck(){
  if(!dicCurrent){const r=document.getElementById('dic-result');if(r)r.innerHTML='<span class="tr-error">Gere uma frase primeiro.</span>';return;}
  const v=(document.getElementById('dic-input').value||'').trim().toLowerCase();
  const correct=dicCurrent.toLowerCase().replace(/[.,!?']/g,'');
  const attempt=v.replace(/[.,!?']/g,'');
  const r=document.getElementById('dic-result');
  if(attempt===correct){r.innerHTML='<span class="tr-correct">Perfeito! ✅</span><br><span class="tr-note">'+escHtml(dicCurrent)+'</span>';}
  else{r.innerHTML='<span class="tr-error">Não exatamente.</span><br><span class="tr-note">Correto: <strong>'+escHtml(dicCurrent)+'</strong></span>';}
}
function toolDict(){
  const v=document.getElementById('dict-input').value.trim();if(!v)return;
  const btn=document.getElementById('dict-btn');if(btn)btn.disabled=true;
  document.getElementById('dict-result').innerHTML='<span class="tr-loading">Buscando...</span>';
  callClaude('Dictionary for Brazilian students. Word: "'+v+'". Reply in 3 lines:\n📌 <word> — <Portuguese meaning>\n📝 <example sentence> — <Portuguese translation>\n🔊 <pronunciation hint in Portuguese phonetics>',res=>{document.getElementById('dict-result').innerHTML=res.split('\n').join('<br>');if(btn)btn.disabled=false;});
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function callClaude(prompt,cb){
  try{
    const r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
    if(!r.ok){cb('⚠️ Ferramenta disponível no site completo.');return;}
    const d=await r.json();cb(d.text||'Erro ao processar.');
  }catch(e){cb('⚠️ Ferramenta disponível no site completo.');}
}

go(0);
</script>
